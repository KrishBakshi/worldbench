    return 'Night';
  }
  function smoothstep(e0, e1, x) {
    const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  }

  function updateField(f, dt, k) {
    const active = Math.max(0, Math.min(f.count, (k * f.count) | 0));
    f.mesh.visible = active > 0;
    f.mesh.material.opacity = f.opacity * Math.min(1, 0.25 + k);
    const box = f.opts.box;
    const mode = f.opts.mode;
    for (let i = 0; i < f.count; i++) {
      const p = f.pts[i];
      const dmy = f.dummy;
      if (i >= active) {
        dmy.position.set(0, -500, 0);
        dmy.scale.set(0.0001, 0.0001, 0.0001);
        dmy.rotation.set(0, 0, 0);
        dmy.updateMatrix();
        f.mesh.setMatrixAt(i, dmy.matrix);
        continue;
      }
      if (mode === 'fall') {
        p.y += p.vy * dt;
        p.x += (p.vx || 0) * dt;
        if (p.y < box.ground) {
          const s = randBox(box);
          p.x = s.x; p.z = s.z; p.y = s.y;
        }
      } else if (mode === 'sheet') {
        p.x += (f.opts.vx || 20) * dt;
        p.y += (f.opts.vy || 0) * dt;
        if (p.x > box.x1) {
          p.x = box.x0;
          p.y = box.y0 + Math.random() * (box.y1 - box.y0);
          p.z = box.z0 + Math.random() * (box.z1 - box.z0);
        }
      } else {
        p.y += (f.opts.vy || 2) * dt;
        p.x += (f.opts.vx || 0) * dt;
        p.z += Math.sin(time + i) * dt * 0.4;
        if (p.y > box.y1 + 8) {
          const s = randBox(box);
          p.x = s.x; p.z = s.z; p.y = box.y0;
        }
      }
      dmy.position.set(p.x, p.y, p.z);
      dmy.scale.set(1, 1, 1);
      dmy.rotation.set(0, 0, 0);
      dmy.updateMatrix();
      f.mesh.setMatrixAt(i, dmy.matrix);
    }
    f.mesh.instanceMatrix.needsUpdate = true;
  }

  function updateBombs(dt, k) {
    const active = (k * bombs.count) | 0;
    bombs.mesh.visible = active > 0;
    for (let i = 0; i < bombs.count; i++) {
      const p = bombs.pts[i];
      if (i >= active) {
        bombs.dummy.position.set(0, -500, 0);
        bombs.dummy.scale.set(0.0001, 0.0001, 0.0001);
      } else {
        if (p.y < 20 || p.life == null) {
          p.x = VX + (Math.random() - 0.5) * 4;
          p.y = 78;
          p.z = VZ + (Math.random() - 0.5) * 4;
          p.vx = (Math.random() - 0.5) * 14;
          p.vy = 10 + Math.random() * 16;
          p.vz = (Math.random() - 0.5) * 14;
          p.life = 1;
        }
        p.vy -= 22 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        if (p.y < 18) p.life = null;
        bombs.dummy.position.set(p.x, p.y, p.z);
        bombs.dummy.scale.set(1, 1, 1);
      }
      bombs.dummy.rotation.set(0, 0, 0);
      bombs.dummy.updateMatrix();
      bombs.mesh.setMatrixAt(i, bombs.dummy.matrix);
    }
    bombs.mesh.instanceMatrix.needsUpdate = true;
  }

  function updateAnimals(dt) {
    for (let i = 0; i < animals.length; i++) {
      const a = animals[i];
      if (a.kind === 'gull') {
        a.ang += dt * a.speed;
        a.g.position.x = a.hx + Math.cos(a.ang) * a.rad;
        a.g.position.z = a.hz + Math.sin(a.ang) * a.rad;
        a.g.position.y = a.baseY + Math.sin(time * 2 + a.phase) * 1.6;
        a.g.rotation.y = -a.ang;
        if (a.wings) {
          const s = Math.sin(time * 8 + a.phase);
          a.wings[0].rotation.z = 0.25 + s * 0.55;
          a.wings[1].rotation.z = -0.25 - s * 0.55;
        }
        continue;
      }
      if (a.kind === 'fish') {
        a.ang += dt * a.speed;
        const nx = a.hx + Math.cos(a.ang) * a.rad;
        const nz = a.hz + Math.sin(a.ang) * a.rad;
        const id = cellIndex(nx, nz);
        if (id >= 0 && WAT[id] > 0) {
          a.g.position.x = nx;
          a.g.position.z = nz;
        }
        a.g.position.y = a.baseY + Math.sin(time * 3 + a.phase) * 0.2;
        a.g.rotation.y = -a.ang;
        continue;
      }
      const dx = a.tx - a.x, dz = a.tz - a.z;
      const dist = Math.hypot(dx, dz) || 0.0001;
      if (dist < 0.7) chooseTarget(a);
      else {
        const step = Math.min(dist, a.speed * dt);
        const nx = a.x + (dx / dist) * step;
        const nz = a.z + (dz / dist) * step;
        if (walkable(a, nx, nz)) {
          a.x = nx; a.z = nz;
          a.g.position.x = nx; a.g.position.z = nz;
          a.g.rotation.y = Math.atan2(dx, dz);
          const id = cellIndex(nx, nz);
          if (id >= 0) a.g.position.y = SOL[id] * S + S / 2;
        } else chooseTarget(a);
      }
      if (a.legs) {
        const s = Math.sin(time * a.speed * 2.4 + a.phase);
        a.legs[0].rotation.x = s * 0.55;
        a.legs[1].rotation.x = -s * 0.55;
        a.legs[2].rotation.x = -s * 0.55;
        a.legs[3].rotation.x = s * 0.55;
      }
      if (a.tail) a.tail.rotation.y = Math.sin(time * 6 + a.phase) * 0.4;
    }
  }

  function updateFalls(dt) {
    if (!fallMesh) return;
    for (let i = 0; i < fallPts.length; i++) {
      const p = fallPts[i];
      p.y -= 16 * dt;
      if (p.y < p.e.y1) {
        p.y = p.e.y0;
        p.x = p.e.x + (Math.random() - 0.5) * 1.1;
        p.z = p.e.z + (Math.random() - 0.5) * 1.1;
      }
      fallDummy.position.set(p.x, p.y, p.z);
      fallDummy.scale.set(1, 1, 1);
      fallDummy.rotation.set(0, 0, 0);
      fallDummy.updateMatrix();
      fallMesh.setMatrixAt(i, fallDummy.matrix);
    }
    fallMesh.instanceMatrix.needsUpdate = true;
  }

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    const dt = Math.min(0.05, clock.getDelta());
    time += dt;
    const ang = (time / DAY) * Math.PI * 2;
    const elev = Math.sin(ang);
    const orbit = Math.cos(ang);
    const day = smoothstep(-0.08, 0.42, elev);
    const si = seasonAt(time);
    sunMesh.position.set(orbit * 230, elev * 130 + 36, orbit * 36 - 20);
    sunMesh.visible = elev > -0.02;
    tmpC.copy(seasonTint[si]);
    if (elev < 0.35) tmpC.lerp(duskC, smoothstep(0.35, -0.05, elev));
    if (elev < 0) tmpC.lerp(nightC, smoothstep(0, -0.45, elev));
    sun.color.copy(tmpC);
    amb.color.copy(tmpC);
    sunMesh.material.color.copy(tmpC).lerp(whiteC, day * 0.3);
    amb.intensity = 0.05 + day * 0.5;
    sun.intensity = 0.035 + day * 1.32;
    fill.intensity = 0.02 + day * 0.14;
    sun.position.copy(sunMesh.position);
    const erupt = eruptNow();
    matLava.emissiveIntensity = 0.7 + erupt * 1.15 + Math.sin(time * 6) * 0.08;
    matCrater.emissiveIntensity = 0.95 + erupt * 1.5 + Math.sin(time * 8) * 0.12;
    lavaLight.intensity = 2.4 + erupt * 7.5;
    if (waterMesh) waterMesh.position.y = Math.sin(time * 1.3) * 0.05;

    const sName = SEASONS[si];
    const pName = phaseName(ang);
    if (sName !== lastSeason) { seasonEl.textContent = sName; lastSeason = sName; }
    if (pName !== lastPhase) { phaseEl.textContent = pName; lastPhase = pName; }

    if (fly) {
      fly.t += dt / fly.dur;
      const k = fly.t >= 1 ? 1 : fly.t * fly.t * (3 - 2 * fly.t);
      camera.position.lerpVectors(fly.sp, fly.ep, k);
      target.lerpVectors(fly.st, fly.et, k);
      camera.lookAt(target);
      if (fly.t >= 1) { fly = null; syncSphere(); }
    } else {
      const decay = Math.exp(-dt * 7);
      spherical.theta += vTheta;
      spherical.phi += vPhi;
      spherical.radius += vRad;
      vTheta *= decay; vPhi *= decay; vRad *= decay;
      applySphere();
    }

    for (let i = 0; i < fields.length; i++) updateField(fields[i], dt, fields[i].opts.intensity());
    updateBombs(dt, erupt);
    for (let i = 0; i < cloudDecks.length; i++) {
      const d = cloudDecks[i];
      const k = d.fn();
      d.mesh.material.opacity = Math.min(0.9, k * 0.88);
      d.mesh.visible = k > 0.04;
      d.mesh.position.x = Math.sin(time * 0.12 + d.phase) * d.drift;
      d.mesh.position.z = Math.cos(time * 0.08 + d.phase) * d.drift * 0.35;
    }
    updateAnimals(dt);
    updateFalls(dt);
    renderer.render(scene, camera);
  }
  window.__debug = {
    terrain: (terrainB.a.length / 6) | 0,
    flora: (floraB.a.length / 6) | 0,
    water: (waterB.a.length / 6) | 0,
    lava: ((lavaB.a.length + craterB.a.length) / 6) | 0,
    falls: emitters.length,
    obs: (obsB.a.length / 6) | 0
  };
  window.__view = function (px, py, pz, tx, ty, tz) {
    fly = null;
    camera.position.set(px, py, pz);
    target.set(tx, ty, tz);
    camera.lookAt(target);
    syncSphere();
  };
  renderer.setAnimationLoop(animate);
})();
</script>
</body>
