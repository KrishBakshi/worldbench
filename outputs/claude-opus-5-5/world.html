<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   RNG + NOISE
   ========================================================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20260923);
const R = (a=0,b=1)=>a+(b-a)*rnd();
const pick = arr => arr[Math.floor(rnd()*arr.length)];
const PERM = new Uint8Array(512);
{ const p=[...Array(256).keys()]; for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));[p[i],p[j]]=[p[j],p[i]];} for(let i=0;i<512;i++)PERM[i]=p[i&255]; }
const h2=(x,z)=>PERM[(x&255)+PERM[z&255]]/127.5-1;
function vnoise(x,z){const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);
  const a=h2(ix,iz),b=h2(ix+1,iz),c=h2(ix,iz+1),d=h2(ix+1,iz+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,z,o=4){let s=0,a=1,f=1,n=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f+i*13.7,z*f-i*9.1);n+=a;a*=.5;f*=2.03;}return s/n;}
function ridged(x,z){let s=0,a=1,f=1,n=0;for(let i=0;i<5;i++){let v=1-Math.abs(vnoise(x*f+i*7.1,z*f-i*3.3));v*=v;s+=v*a;n+=a;a*=.5;f*=2.1;}return s/n;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};

/* =========================================================
   WORLD GRID
   ========================================================= */
const N=144, HALF=72, R0=66, SL=4;           // grid size, island radius, sea level
const NN=N*N;
const BI={MOUNT:0,SNOWF:1,HIGH:2,JUNGLE:3,SWAMP:4,GRASS:5,GROVE:6,DESERT:7,VOLC:8,OCEAN:9,BEACH:10};
const S_LAND=0,S_RIVER=1,S_OCEAN=2,S_SWAMP=3,S_LAVA=4,S_OBS=5,S_POND=6;
const F_MESA=1,F_LEDGE=2,F_ROCK=4,F_CRATER=8,F_WASH=16,F_REEF=32,F_CLEAR=64,F_MIX=128;
const B=new Int8Array(NN).fill(-1), H=new Float32Array(NN), H0=new Float32Array(NN), BOT=new Float32Array(NN),
      WL=new Float32Array(NN), S=new Uint8Array(NN), F=new Uint8Array(NN), WASHT=new Float32Array(NN);
const cx=i=>i-HALF+.5, ci=x=>Math.floor(x+HALF);
const inGrid=(i,j)=>i>=0&&j>=0&&i<N&&j<N;
const inside=(i,j)=>inGrid(i,j)&&B[j*N+i]>=0;
const kAt=(x,z)=>{const i=ci(x),j=ci(z);return inside(i,j)?j*N+i:-1;};
const isWater=k=>S[k]===S_RIVER||S[k]===S_OCEAN||S[k]===S_SWAMP||S[k]===S_POND;

// Biome seeds: [biome, x, z, weight]   (+z = south / front, -z = north / behind)
const SEEDS=[
  [0,-44,-50,1.1],[0,-24,-58,1.1],[0,-2,-62,1.1],[0,20,-58,1.1],[0,34,-52,1],
  [1,-30,-34,1],[1,-13,-40,1],[1,1,-42,.9],
  [2,14,-30,1],[2,25,-27,1],
  [3,-42,-6,1.15],[3,-40,12,1.15],[3,-27,24,1.05],[3,-27,0,1],
  [4,-54,-20,1],[4,-47,-32,.95],
  [5,-6,2,1.1],[5,-4,20,1.1],[5,8,12,1],[5,4,34,1],
  [6,20,-5,1],[6,28,5,.95],
  [7,36,30,1.15],[7,50,15,1.1],[7,20,42,1],[7,52,32,1],
  [8,44,-18,1.1],[8,56,-28,1],[8,58,-5,1]
];
function baseH(b,x,z){switch(b){
  case 0: return 21 + 30*Math.pow(ridged(x*.04+3,z*.04+9),1.3) + 11*clamp((-z-46)/16,0,1);
  case 1: return 18 + 2.2*fbm(x*.09,z*.09);
  case 2: return 14.5 + 2.5*fbm(x*.07+3,z*.07) + 6*Math.max(0,fbm(x*.16+9,z*.16)-.12);
  case 3: return 9 + 2.4*fbm(x*.08+1,z*.08+2);
  case 4: return 5.4 + .9*fbm(x*.12,z*.12);
  case 5: return 7 + .7*fbm(x*.06,z*.06);
  case 6: return 6.2 + .8*fbm(x*.1+4,z*.1);
  case 7: return 6.6 + 1.2*fbm(x*.07+8,z*.07);
  case 8: return 9 + 2*fbm(x*.1+2,z*.1+5);
}}
const VX=44, VZ=-18, VR=21;                              // volcano
const MESAS=[[36,29,7,21],[25,39,4,15],[51,16,4.6,17],[47,38,3.6,13],[30,48,2.6,11]];
const LEDGE=[-22,-17,6.5,16];
const ISLETS=[[-30,50,2.6],[-50,31,3],[-57,-4,2.2],[14,56,2]];

for(let j=0;j<N;j++)for(let i=0;i<N;i++){
  const x=cx(i), z=cx(j), d=Math.hypot(x,z), a=Math.atan2(z,x);
  const edgeR=R0*(1+.06*vnoise(Math.cos(a)*2.2+20,Math.sin(a)*2.2+20)+.025*Math.sin(3*a+.7));
  if(d>edgeR) continue;
  const k=j*N+i;
  // biome blend (domain-warped weighted voronoi with soft-min height blending)
  const wx=x+7*vnoise(x*.05+11,z*.05), wz=z+7*vnoise(x*.05,z*.05+17);
  const bd=[1e9,1e9,1e9,1e9,1e9,1e9,1e9,1e9,1e9];
  for(const s of SEEDS){const dd=Math.hypot(wx-s[1],wz-s[2])/s[3]; if(dd<bd[s[0]])bd[s[0]]=dd;}
  let dmin=1e9,bb=0; for(let q=0;q<9;q++) if(bd[q]<dmin){dmin=bd[q];bb=q;}
  let sw=0,sh=0; for(let q=0;q<9;q++){const w=Math.exp(-(bd[q]-dmin)/3.2); if(w<1e-3)continue; sw+=w; sh+=w*baseH(q,x,z);}
  let h=sh/sw, b=bb, f=0;
  // volcano cone + crater
  const dv=Math.hypot(x-VX,z-VZ);
  if(dv<VR){
    const rim=10+50*Math.pow(1-4.4/VR,1.2);
    let cone=10+50*Math.pow(1-dv/VR,1.2)+1.2*fbm(x*.3,z*.3);
    if(dv<4.4){cone=rim-7; f|=F_CRATER;}
    if(cone>h-1){h=Math.max(h,cone); b=BI.VOLC;}
  }
  // jungle rock ledge (major waterfall step)
  const dl=Math.hypot(x-LEDGE[0],z-LEDGE[1])+1.2*vnoise(x*.4,z*.4);
  if(dl<LEDGE[2] && (b===BI.JUNGLE||b===BI.SNOWF||b===BI.GRASS)){ h=Math.max(h,LEDGE[3]-(dl>LEDGE[2]-1.5?1:0)); f|=F_LEDGE; }
  // coast (south + west arc)
  const deg=((a*180/Math.PI)+360)%360;
  const ow=sstep(36,60,deg)*(1-sstep(188,208,deg));
  let inner=edgeR*(.77+.035*Math.sin(5*a+1.3)+.03*vnoise(x*.08+40,z*.08));
  inner=lerp(edgeR*1.4,inner,ow);
  const cT=(d-inner)/edgeR;
  const headland=Math.sin(9*a+.4)>.93;
  if(cT>0){
    b=BI.OCEAN; S[k]=S_OCEAN; WL[k]=SL;
    h=SL-1-Math.min(5,Math.floor(cT*55));
    if(h>=SL-2 && vnoise(x*.28+3,z*.28)>.3) f|=F_REEF;
    if(headland && cT<.05){h=SL+2;b=BI.BEACH;f|=F_ROCK;S[k]=S_LAND;}
  } else if(cT>-.045 && ow>.25){
    b=BI.BEACH; h=SL+1+(cT<-.025?1:0);
    if(headland){h=SL+3;f|=F_ROCK;}
  } else if(cT>-.14 && ow>.05){
    h=lerp(SL+1.6,h,sstep(-.045,-.14,cT));
  }
  // desert sandstone mountains (never the volcano)
  if(S[k]!==S_OCEAN && (b===BI.DESERT||b===BI.BEACH)){
    for(const m of MESAS){
      const dm=Math.hypot(x-m[0],z-m[1])+1.3*vnoise(x*.45,z*.45);
      if(dm<m[2]){ const t=m[3]-Math.floor(Math.max(0,dm-m[2]*.4)*1.7); if(t>h){h=t;f|=F_MESA;b=BI.DESERT;} }
    }
  }
  if(b===BI.JUNGLE && fbm(x*.18+50,z*.18)>.4) f|=F_CLEAR;
  B[k]=b; H[k]=Math.round(h); F[k]=f;
  BOT[k]=-13 - 50*Math.pow(Math.max(0,1-d/edgeR),.7)*(.85+.25*vnoise(x*.07+5,z*.07)) + 4*vnoise(x*.3,z*.3) - Math.max(0,H[k]-10)*.35;
}
// islets in the lagoon
for(const [ix,iz,ir] of ISLETS){
  for(let j=ci(iz-ir-1);j<=ci(iz+ir+1);j++)for(let i=ci(ix-ir-1);i<=ci(ix+ir+1);i++){
    if(!inside(i,j))continue; const k=j*N+i; if(S[k]!==S_OCEAN)continue;
    const dd=Math.hypot(cx(i)-ix,cx(j)-iz)+.8*vnoise(cx(i)*.6,cx(j)*.6);
    if(dd<ir){S[k]=S_LAND;B[k]=BI.BEACH;H[k]=SL+(dd<ir*.5?2:1);F[k]&=~F_REEF;}
  }
}
H0.set(H);

/* ---------- hydrology ---------- */
const mouths=[];
function carve(pts,w0,w1,type,opt={}){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],0,p[1])),false,'centripetal');
  const L=curve.getLength(), steps=Math.ceil(L*3);
  let bed=opt.start??1e9;
  const mz=opt.meander??1.6, seed=pts[0][0]*.37+pts[0][1]*.11;
  for(let s=0;s<=steps;s++){
    const t=s/steps, p=curve.getPointAt(t), tg=curve.getTangentAt(t);
    const m=mz*vnoise(t*L*.09+seed,3.7+seed);
    const px=p.x-tg.z*m, pz=p.z+tg.x*m;
    const i0=ci(px), j0=ci(pz);
    if(!inside(i0,j0)){ if(opt.offEdge) break; else continue; }
    const k0=j0*N+i0;
    if(S[k0]===S_OCEAN){ mouths.push([px,pz]); break; }
    if(type!==S_SWAMP || true) bed=Math.min(bed,H0[k0]-1);
    const w=lerp(w0,w1,t), r=Math.ceil(w);
    for(let dj=-r;dj<=r;dj++)for(let di=-r;di<=r;di++){
      if(di*di+dj*dj>w*w+.3)continue;
      const ii=i0+di,jj=j0+dj; if(!inside(ii,jj))continue; const kk=jj*N+ii;
      if(S[kk]===S_OCEAN||S[kk]===S_LAVA)continue;
      const lvl=Math.min(bed,H0[kk]-1);
      if(S[kk]!==S_LAND && WL[kk]<=lvl)continue;
      S[kk]=type; WL[kk]=lvl; H[kk]=lvl-1;
    }
  }
}
function pond(x,z,r,type){
  const cells=[]; let mn=1e9;
  for(let j=ci(z-r-1);j<=ci(z+r+1);j++)for(let i=ci(x-r-1);i<=ci(x+r+1);i++){
    if(!inside(i,j))continue; const k=j*N+i; if(S[k]===S_OCEAN)continue;
    if(Math.hypot(cx(i)-x,cx(j)-z)+.9*vnoise(cx(i)*.5,cx(j)*.5)<r){cells.push(k);mn=Math.min(mn,S[k]===S_LAND?H[k]:WL[k]+1);}
  }
  for(const k of cells){
    if(type===S_LAVA){ if(isWater(k))continue; S[k]=S_LAVA; H[k]=mn; }
    else { if(S[k]!==S_LAND && WL[k]<=mn-1) continue; S[k]=type; WL[k]=mn-1; H[k]=mn-2; }
  }
}
// wet corridor: mountain melt -> snow forest -> ledge falls -> jungle -> grassland -> delta
carve([[-10,-58],[-14,-46],[-19,-33],[-22,-23],[-23,-16],[-26,-9],[-31,-1],[-25,7],[-15,10],[-7,16],[-3,24],[-6,32],[-2,40],[-2,46],[-2,62]],.8,2.2,S_RIVER);
// highland melt stream (past snow-forest foothills & wet highlands -> jungle)
carve([[13,-54],[14,-43],[12,-33],[6,-23],[-4,-15],[-14,-9],[-24,-6]],.6,1.3,S_RIVER);
// western mountain melt through snow forest into swamp/jungle
carve([[-34,-54],[-34,-42],[-33,-30],[-34,-20],[-32,-8]],.6,1.1,S_RIVER);
// grove feeder from the highland slope, crosses plains to join main river
carve([[24,-30],[23,-18],[21,-7],[16,3],[8,9],[0,14],[-6,18]],.6,1.2,S_RIVER);
// grassland tributaries (dense winding network)
carve([[6,-2],[4,4],[-1,9],[-6,14]],.5,.8,S_RIVER,{meander:2.4});
carve([[-18,20],[-13,27],[-7,29],[-4,31]],.5,.8,S_RIVER,{meander:2.4});
carve([[13,24],[9,28],[4,31],[-4,35]],.5,.9,S_RIVER,{meander:2.4});
carve([[-18,34],[-12,37],[-5,40]],.5,.8,S_RIVER,{meander:2.2});
carve([[10,40],[5,40],[0,41]],.4,.7,S_RIVER,{meander:2});
carve([[-14,0],[-12,6],[-9,13]],.4,.7,S_RIVER,{meander:2});
// braided delta
carve([[-2,40],[-9,45],[-13,50],[-16,62]],1.1,1.6,S_RIVER,{meander:1});
carve([[-2,40],[5,45],[9,50],[12,62]],1.1,1.6,S_RIVER,{meander:1});
carve([[-9,45],[-4,48],[3,50],[7,56]],.8,1.2,S_RIVER,{meander:.6});
carve([[-2,46],[-7,50],[-8,60]],.8,1.1,S_RIVER,{meander:.6});
// jungle river to the west coast
carve([[-31,-1],[-40,4],[-49,11],[-57,17],[-70,21]],1,1.8,S_RIVER);
// stagnant backwater channels into the swamp (jungle's far side)
carve([[-36,-6],[-42,-13],[-49,-20],[-53,-29]],1.1,1.7,S_SWAMP,{meander:2.2});
carve([[-44,-10],[-52,-12],[-58,-18]],.8,1.4,S_SWAMP,{meander:2});
// NE meltwater creek -> passes lava field (obsidian) -> falls off the cliff edge
carve([[24,-57],[30,-50],[37,-44],[44,-41.5],[52,-41],[60,-42],[74,-42]],.6,1,S_RIVER,{offEdge:true});

// ponds / lagoons
[[-44,2,2.6],[-34,16,2.2],[-38,-12,2],[-47,20,1.8]].forEach(p=>pond(...p,S_POND));
[[20,-31,2.2],[28,-22,1.6],[10,22,2],[26,1,1.8],[-10,-28,1.6]].forEach(p=>pond(...p,S_POND));
{ // swamp pools
  const sw=[]; for(let k=0;k<NN;k++) if(B[k]===BI.SWAMP&&S[k]===S_LAND) sw.push(k);
  for(let n=0;n<22&&sw.length;n++){const k=pick(sw); pond(cx(k%N),cx((k/N)|0),R(1.4,3.2),S_SWAMP);}
}
// lava: crater, tributaries, pools on volcanic ground only
function lavaPath(pts,w){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],0,p[1])));
  const L=curve.getLength(), steps=Math.ceil(L*3);
  for(let s=0;s<=steps;s++){
    const p=curve.getPointAt(s/steps), tg=curve.getTangentAt(s/steps), m=1.1*vnoise(s*.08+pts[0][1],9);
    const px=p.x-tg.z*m, pz=p.z+tg.x*m, r=Math.ceil(w);
    for(let dj=-r;dj<=r;dj++)for(let di=-r;di<=r;di++){
      if(di*di+dj*dj>w*w+.3)continue; const ii=ci(px)+di,jj=ci(pz)+dj; if(!inside(ii,jj))continue; const kk=jj*N+ii;
      if(S[kk]!==S_LAND||B[kk]!==BI.VOLC)continue; S[kk]=S_LAVA;
    }
  }
}

function wash(pts,w){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],0,p[1])));
  const L=curve.getLength(), steps=Math.ceil(L*3);
  for(let s=0;s<=steps;s++){
    const t=s/steps, p=curve.getPointAt(t), tg=curve.getTangentAt(t), m=1.8*vnoise(t*L*.1+pts[0][0],5);
    const ww=w*(1-t*.85), r=Math.ceil(ww);
    for(let dj=-r;dj<=r;dj++)for(let di=-r;di<=r;di++){
      if(di*di+dj*dj>ww*ww+.3)continue; const ii=ci(p.x-tg.z*m)+di,jj=ci(p.z+tg.x*m)+dj; if(!inside(ii,jj))continue; const kk=jj*N+ii;
      if(S[kk]!==S_LAND||B[kk]!==BI.DESERT||(F[kk]&F_MESA))continue;
      if(rnd()<1-t*.7){F[kk]|=F_WASH; WASHT[kk]=Math.max(WASHT[kk],1-t);}
    }
  }
}

const U={uTime:{value:0},uSnow:{value:36}};
function patch(mat,o={}){
  mat.customProgramCacheKey=()=>'vx'+JSON.stringify(o);
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uTime=U.uTime; sh.uniforms.uSnow=U.uSnow;
    sh.vertexShader='attribute float aCold;\nvarying float vCold;\nvarying vec3 vWPos;\nvarying vec3 vWN;\nuniform float uTime;\n'+
      sh.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
      vec4 wp_=vec4(transformed,1.0);
      #ifdef USE_INSTANCING
        wp_=instanceMatrix*wp_;
      #endif
      wp_=modelMatrix*wp_;
      vWPos=wp_.xyz;
      vec3 wn_=normal;
      #ifdef USE_INSTANCING
        wn_=mat3(instanceMatrix)*wn_;
      #endif
      vWN=wn_; vCold=aCold;
      ${o.wave?`if(position.y>0.9){ float sy_=1.0;
      #ifdef USE_INSTANCING
        sy_=length(instanceMatrix[1].xyz);
      #endif
        transformed.y+=(0.09*sin(uTime*1.7+vWPos.x*.45+vWPos.z*.31)-0.14)/sy_; }`:''}
      `);
    sh.fragmentShader='varying float vCold;\nvarying vec3 vWPos;\nvarying vec3 vWN;\nuniform float uTime;\nuniform float uSnow;\nfloat vh3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}\n'+
      sh.fragmentShader.replace('#include <color_fragment>',`#include <color_fragment>
      vec3 n_=normalize(vWN); vec3 an_=abs(n_);
      vec2 uv_= an_.y>0.5 ? vWPos.xz : (an_.x>0.5 ? vWPos.zy : vWPos.xy);
      vec3 bp_=floor(vWPos-n_*0.02);
      vec2 px_=floor(uv_*${o.px||'6.0'});
      float nz_=vh3(vec3(px_*0.37,dot(bp_,vec3(1.0,57.0,113.0))*0.013+n_.y*3.0+n_.x*1.7));
      diffuseColor.rgb*=${o.base||'0.91'}+${o.amp||'0.17'}*nz_;
      ${o.grid?`{vec2 f_=fract(uv_); vec2 d_=min(f_,1.0-f_); float e_=min(d_.x,d_.y); diffuseColor.rgb*=1.0-${o.grid}*(1.0-smoothstep(0.0,0.06,e_));}`:''}
      ${o.depth?`diffuseColor.rgb*=mix(0.32,1.0,smoothstep(-55.0,2.0,vWPos.y));`:''}
      ${o.snow?`{float sn_=vCold*step(0.5,n_.y)*smoothstep(uSnow-1.0,uSnow+1.0,vWPos.y); diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.93,0.96,1.0),sn_*0.93);}`:''}
      ${o.lava?`{float fl_=0.5+0.5*sin(uTime*2.2+vWPos.x*0.8+vWPos.z*0.55+nz_*5.0); diffuseColor.rgb=mix(vec3(0.8,0.12,0.02),vec3(1.0,0.75,0.2),fl_*(0.35+0.65*nz_));}`:''}
      ${o.water?`diffuseColor.rgb*=0.93+0.1*sin(uTime*2.1+px_.x*0.9+px_.y*0.7);`:''}
      `);
    if(o.seams) sh.fragmentShader=sh.fragmentShader.replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
      {float sv_=step(0.86,vh3(vec3(floor(bp_.x/3.0),floor(bp_.y/2.0),floor(bp_.z/3.0))*0.71+1.3))*step(0.42,vh3(bp_*1.03+7.7))*(1.0-smoothstep(-8.0,-4.0,vWPos.y));
       totalEmissiveRadiance+=vec3(0.12,0.7,1.0)*sv_*(0.8+0.35*sin(uTime*1.4+bp_.x*0.7+bp_.z*0.3));
       diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.25,0.75,1.0),sv_);}`);
  };
  return mat;
}

class Batch{
  constructor(){this.m=[];this.c=[];this.cold=[];}
  add(x,y,z,sx,sy,sz,col,cold=0){ if(sy<=0)return; this.m.push(x,y,z,sx,sy,sz); this.c.push(col); this.cold.push(cold); }
  build(mat,cast=true,recv=true){
    const n=this.c.length, g=new THREE.BoxGeometry(1,1,1); g.translate(0,.5,0);
    g.setAttribute('aCold',new THREE.InstancedBufferAttribute(new Float32Array(this.cold),1));
    const mesh=new THREE.InstancedMesh(g,mat,Math.max(n,1)), M=new THREE.Matrix4(), q=new THREE.Quaternion(), v=new THREE.Vector3(), s=new THREE.Vector3();
    for(let i=0;i<n;i++){const o=i*6; v.set(this.m[o],this.m[o+1],this.m[o+2]); s.set(this.m[o+3],this.m[o+4],this.m[o+5]); M.compose(v,q,s); mesh.setMatrixAt(i,M); mesh.setColorAt(i,this.c[i]);}
    mesh.count=n; mesh.castShadow=cast; mesh.receiveShadow=recv; mesh.frustumCulled=false; return mesh;
  }
}

function updPrecip(s,t,dt){

  constructor(kind,biomes){

    const pool=biomes.flatMap(b=>landCells[b]||[]); const k=pick(pool);

  }
  ok(x,z){const k=kAt(x,z); return k>=0&&S[k]===S_LAND&&this.biomes.includes(B[k])&&!(F[k]&(F_MESA|F_ROCK))&&Math.abs(H[k]-this.y)<2.5;}

  update(dt,t){

    else{const dx=this.tx-this.x,dz=this.tz-this.z,d=Math.hypot(dx,dz);

      else{const st=Math.min(d,this.speed*dt),nx=this.x+dx/d*st,nz=this.z+dz/d*st;
        if(this.ok(nx,nz)){this.x=nx;this.z=nz;moving=true;}else this.wait=R(.4,1.2);
        this.g.rotation.y=Math.atan2(dx,dz)+(this.side?Math.PI/2:0); if(this.head)this.head.rotation.x*=.9;}}
    const k=kAt(this.x,this.z); if(k>=0) this.y+=(H[k]-this.y)*Math.min(1,dt*8);

    this.g.position.set(this.x,this.y+hop,this.z);
  }
}

  WX.swampMist.I=clamp((.45+.55*cyc(t,40,.3,.5))*sval(SF.mist)*(1.15-.4*env.dayF),0,1);
  WX.jungleMist.I=clamp(cyc(t,WX.jungle.period,WX.jungle.offset-.72,.3)*sval(SF.mist),0,1);
  WX.highMist.I=clamp(cyc(t,58,.05,.35)*sval(SF.mist),0,1);
  EVAP.I=clamp(env.dayF*(.35+.5*sval([.8,1.3,.8,.3]))+WX.jungleMist.I*.4,0,1);
  const storm=clamp((WX.jungle.I+WX.grass.I+WX.snow.I+BLZ.I+SND.I)/3.2,0,1);
  // lighting
  const tint=tmpC.copy(TINT[Math.floor(((t/YEAR)%1)*4)]);
  sun.color.copy(tint).lerp(dusk,1-sstep(.05,.4,sy)); sun.color.lerp(new THREE.Color('#c9d6e8'),storm*.4);
  sun.intensity=2.7*env.dayF*(1-.35*storm);
  sun.position.copy(sunDir).multiplyScalar(170); sun.castShadow=env.dayF>.02;
  hemi.intensity=.2+.85*env.dayF; hemi.color.copy(nightSky).lerp(daySky,env.dayF);
  moonL.position.copy(sunDir).multiplyScalar(-170); moonL.intensity=.45*(1-env.dayF);
  sunMesh.position.copy(sunDir).multiplyScalar(330); sunHalo.position.copy(sunDir).multiplyScalar(334);
  moonMesh.position.copy(sunDir).multiplyScalar(-330);
  sunMesh.lookAt(camera.position); sunHalo.lookAt(camera.position); moonMesh.lookAt(camera.position);
  sunMesh.material.color.set('#ffe98a').lerp(dusk,1-sstep(.05,.35,sy)); sunMesh.visible=sunHalo.visible=sy>-.2; moonMesh.visible=sy<.2;
  U.uSnow.value=sval(SF.snowline);
  // systems
  precip.forEach(s=>updPrecip(s,t,dt)); updBlizzard(t,dt); updSand(t,dt); updVolcano(t,dt); updSpray(t,rdt);
  for(const m of MIST){ m.mat.opacity=.22*m.I; m.ms.forEach(o=>{o.visible=m.I>.02; o.position.x=o.userData.x+Math.sin(t*.1+o.userData.ph)*3; o.position.z=o.userData.z+Math.cos(t*.08+o.userData.ph)*2;}); }
  EVAP.mat.opacity=.4*EVAP.I; EVAP.obj.visible=EVAP.I>.02;
  if(EVAP.obj.visible){ for(let i=0;i<EVAP.n;i++){const p=EVAP.d[i]; p.y+=p.v*dt; if(p.y>p.y0+12)p.y=p.y0; const o=i*3; EVAP.arr[o]=p.x+Math.sin(t*.5+i)*.6; EVAP.arr[o+1]=p.y; EVAP.arr[o+2]=p.z;} EVAP.obj.geometry.attributes.position.needsUpdate=true; }
  critters.forEach(c=>c.update(dt,t));
  for(const b of birds){b.a+=b.sp*dt; b.g.position.set(b.cx+Math.cos(b.a)*b.r,b.y+Math.sin(t*.7+b.ph)*1.5,b.cz+Math.sin(b.a)*b.r); b.g.rotation.y=-b.a; const f=Math.sin(t*9+b.ph)*.6; b.wl.rotation.z=f; b.wr.rotation.z=-f;}
  for(const f of fish){ const u=(t-f.t0)/f.dur;
    if(u<0||u>1){ f.g.visible=false; if(u>1){const k=pick(f.pool); f.x=cx(k%N); f.z=cx((k/N)|0); const a=R(0,6.28); f.dx=Math.cos(a)*2; f.dz=Math.sin(a)*2; f.t0=t+f.gap*R(.5,1.5);} continue; }
    f.g.visible=true; f.g.position.set(f.x+f.dx*u,SL+Math.sin(u*Math.PI)*1.6-.2,f.z+f.dz*u); f.g.rotation.set(-Math.cos(u*Math.PI)*1.1,Math.atan2(f.dx,f.dz),0);}
  fragments.forEach(g=>{g.position.y=g.userData.y0+Math.sin(t*g.userData.sp+g.userData.ph)*1.2; g.rotation.y+=rdt*.02;});
  // camera flight
  if(fly){const u=clamp((performance.now()-fly.s)/fly.d,0,1), e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    camera.position.lerpVectors(fly.p0,fly.p1,e); camera.position.y+=Math.sin(Math.PI*e)*18; controls.target.lerpVectors(fly.t0,fly.t1,e); if(u>=1)fly=null;}
  controls.update();
  const now=performance.now(); if(now-lastHud>200){lastHud=now; updHud();}
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});
document.getElementById('loading').remove();
updHud();
renderer.setAnimationLoop(frame);
</script>
