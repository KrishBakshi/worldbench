}

const legend=document.getElementById('legend');
let fly=null;
Object.entries(views).forEach(([k,v])=>{
 let d=document.createElement('div'); d.className='item'+(k==='overview'?' active':'');
 d.innerHTML=`<span class="sw" style="background:${v.color}"></span>${v.label}<small>${v.weather}</small>`;
 d.onclick=()=>{document.querySelectorAll('.item').forEach(e=>e.classList.remove('active'));d.classList.add('active');
   fly={t:0,fromP:camera.position.clone(),fromT:controls.target.clone(),toP:new THREE.Vector3(...v.pos),toT:new THREE.Vector3(...v.tgt)}};

});

const seasons=[['Spring','melt & showers rising',0xffe8b0],['Summer','heavy rain · bright sun',0xfff2a0],['Autumn','gold light · fading rain',0xffc080],['Winter','deep snow · low light',0xcfe4ff]];
let seasonIdx=-1;
function burst(t,off){let p=((t+off)%18)/18; return p<.15?p/.15:(p<.65?1:(p<.8?(0.8-p)/.15:0))}
const clockEl=document.getElementById('daypart');
function animate(){
 requestAnimationFrame(animate);
 let t=performance.now()/1000; if(window.__WB_TIME?.tod!=null) t=(window.__WB_TIME.tod*48+12)%48;
 let si=window.__WB_TIME?.season!=null ? window.__WB_TIME.season : Math.floor(t/28)%4;
 if(si!==seasonIdx){seasonIdx=si; document.getElementById('seasonName').textContent=seasons[si][0]; document.getElementById('seasonNote').textContent=seasons[si][1];}
 let seasonRain=[1,.85,.6,.35][si], seasonSnow=[.7,.3,.6,1.3][si];
 let ang=(t/48)*Math.PI*2 - Math.PI/2;
 let sx=Math.cos(ang)*110, sy=Math.sin(ang)*90+8, sz=45;
 sunMesh.position.set(sx,sy,sz); sunLight.position.set(sx,sy,sz);
 let day=Math.max(0,Math.sin(ang));
 sunLight.intensity=.08+day*1.7; sunLight.color.setHex(seasons[si][2]);
 ambient.intensity=.12+day*.5;
 ember.intensity=1.2+Math.sin(t*2)*.3;
 clockEl.textContent= day>.65?'☀ Noon':(day>.25?'🌤 Day':(day>.05?'🌇 Dusk / Dawn':'🌙 Night'));
 rainJ.pts.material.opacity=.75*burst(t,0)*seasonRain; rainG.pts.material.opacity=.5*burst(t,7)*seasonRain;
 snowP.pts.material.opacity=.9*burst(t,3)*Math.min(1,seasonSnow); bliz.pts.material.opacity=.85*burst(t,0);
 sand.pts.material.opacity=.7*burst(t,11); ash.pts.material.opacity=.65*(0.4+0.6*burst(t,5));
 function fall(sys,speed,dx=0){let p=sys.pts.geometry.attributes.position; for(let i=0;i<sys.n;i++){let y=p.getY(i)-speed*.12; let x=p.getX(i)+dx*.12; if(y<sys.area.y-sys.area.h/2){y=sys.area.y+sys.area.h/2; x=sys.area.x+(rnd()-.5)*sys.area.w} p.setY(i,y); p.setX(i,x);} p.needsUpdate=true}
 fall(rainJ,3); fall(rainG,2.6); fall(snowP,1.1,.15); fall(sand,.4,2.2); fall(ash,.7,-.2);
 {let p=bliz.pts.geometry.attributes.position; for(let i=0;i<bliz.n;i++){let x=p.getX(i)+.55; if(x>32)x=-32; p.setX(i,x); p.setY(i,bliz.area.y+Math.sin(t*3+i)*2)} p.needsUpdate=true}
 let erupt=Math.max(0,Math.sin(t*.7))>.92;
 lavaP.pts.material.opacity=erupt?1:.25;
 {let p=lavaP.pts.geometry.attributes.position; for(let i=0;i<lavaP.n;i++){let y=p.getY(i)+(erupt?.35:.06); if(y>26)y=17; p.setY(i,y)} p.needsUpdate=true}
 clouds.forEach((c,i)=>{c.position.x+=Math.sin(t*.05+i)*.008+.012; if(c.position.x>65)c.position.x=-65});
 animals.forEach(a=>{let tt=t*a.sp+a.ph; a.g.position.x=a.cx+Math.cos(tt)*a.r; a.g.position.z=a.cz+Math.sin(tt)*a.r; a.g.position.y=a.y+Math.abs(Math.sin(t*3+a.ph))*.08; a.g.rotation.y=-tt});
 birds.forEach((b,i)=>{b.g.position.x+=.08; b.g.position.y+=Math.sin(t*2+b.ph)*.02; b.g.rotation.z=Math.sin(t*4+b.ph)*.3; if(b.g.position.x>20)b.g.position.x=-55});
 if(fly){fly.t+=.016/1.7; let e=fly.t>=1?1:(1-Math.pow(1-fly.t,3)); camera.position.lerpVectors(fly.fromP,fly.toP,e); controls.target.lerpVectors(fly.fromT,fly.toT,e); if(fly.t>=1)fly=null}
 controls.update(); renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
