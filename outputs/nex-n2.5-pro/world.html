<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxel Isles — Floating Biome Continent</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;}
  #app{position:fixed;inset:0;}
  #panel{position:fixed;top:14px;left:14px;width:242px;background:rgba(8,11,16,.76);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#e4eaf2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 12px 10px;user-select:none;box-shadow:0 8px 30px rgba(0,0,0,.5);}
  #panel h1{font-size:13px;letter-spacing:3px;margin:0 0 8px;color:#fff;font-weight:700;}
  #seasonRow{display:flex;justify-content:space-between;font-size:10px;color:#9fb2c8;margin-bottom:5px;letter-spacing:1px;}
  #seasonRow b{color:#ffd98a;font-weight:700;}
  #tod{color:#8fd6ff;}
  #wx{font-size:9px;color:#7f93a8;min-height:24px;margin-bottom:8px;line-height:1.4;letter-spacing:.4px;}
  #legend{max-height:44vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent;}
  #legend::-webkit-scrollbar{width:4px;}#legend::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:2px;}
  .li{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:11px;transition:background .15s;}
  .li:hover{background:rgba(255,255,255,.08);}
  .li.active{background:rgba(120,170,255,.16);outline:1px solid rgba(120,170,255,.35);}
  .dot{width:10px;height:10px;border-radius:2px;flex:none;}
  .lname{flex:1;white-space:nowrap;}
  .lflav{font-size:8.5px;color:#8496aa;text-align:right;max-width:98px;line-height:1.3;}
  #hint{font-size:9px;color:#6d7f92;margin-top:8px;border-top:1px solid rgba(255,255,255,.08);padding-top:7px;line-height:1.55;letter-spacing:.5px;}
  @media (max-width:640px){#panel{width:196px;padding:10px;}.lflav{display:none;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="panel">
  <h1>VOXEL ISLES</h1>
  <div id="seasonRow"><span>SEASON · <b id="seasonName">SPRING</b></span><span id="tod">DAY</span></div>
  <div id="wx"></div>
  <div id="legend"></div>
  <div id="hint">DRAG orbit · SCROLL zoom<br>RIGHT-DRAG pan · CLICK biome to fly</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
/* ============================== helpers ============================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=mulberry32(987654321);
const hash2=(x,z)=>{const n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n);};
function vnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
 return hash2(xi,zi)*(1-u)*(1-v)+hash2(xi+1,zi)*u*(1-v)+hash2(xi,zi+1)*(1-u)*v+hash2(xi+1,zi+1)*u*v;}
const fbm=(x,z)=>vnoise(x,z)*0.55+vnoise(x*2.13+5.2,z*2.13+1.3)*0.27+vnoise(x*4.31+9.1,z*4.31+3.7)*0.18;
const sstep=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);};
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const pulse=(t,period,active,offset)=>{const p=((t+offset)%period+period)%period;const act=period*active;const fade=period*0.18;
 if(p<fade)return p/fade; if(p<act-fade)return 1; if(p<act)return (act-p)/fade; return 0;};

/* ============================== renderer / scene ============================== */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
document.getElementById('app').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
scene.fog=new THREE.FogExp2(0x000000,0);

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,700);
camera.position.set(58,50,68);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.maxDistance=260;controls.minDistance=5;
controls.maxPolarAngle=Math.PI*0.94;
controls.target.set(0,4,0);
controls.autoRotate=true;controls.autoRotateSpeed=0.35;

const hemi=new THREE.HemisphereLight(0xbfd4e6,0x3a3325,0.7);scene.add(hemi);
const dir=new THREE.DirectionalLight(0xffffff,1.0);
dir.castShadow=true;dir.shadow.mapSize.set(2048,2048);
const sc=dir.shadow.camera;sc.left=-64;sc.right=64;sc.top=64;sc.bottom=-64;sc.near=10;sc.far=280;
dir.shadow.bias=-0.0006;
scene.add(dir);scene.add(dir.target);

const unitGeo=new THREE.BoxGeometry(1,1,1);
const dummy=new THREE.Object3D();
const lam=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));

/* ============================== world grid ============================== */
const N=72,HALF=N/2,WL=1.6;
const LAND=new Uint8Array(N*N),H=new Float32Array(N*N),BIO=new Uint8Array(N*N);
const RIV=new Uint8Array(N*N),WTOP=new Float32Array(N*N),WTYPE=new Uint8Array(N*N);
const WASH=new Uint8Array(N*N),OBS=new Uint8Array(N*N),LAVA_ADJ=new Uint8Array(N*N),LUSH=new Uint8Array(N*N);

const REGIONS=[
 {id:1,x:0,z:-26,rx:15,rz:9,h:10},
 {id:2,x:-2,z:-15,rx:16,rz:6.5,h:7.5},
 {id:3,x:25,z:-13,rx:12,rz:9,h:9},
 {id:4,x:-20,z:0,rx:14,rz:11,h:4.6},
 {id:5,x:-21,z:-9,rx:10,rz:4.5,h:2.2},
 {id:6,x:0,z:9,rx:16,rz:13,h:3.2},
 {id:7,x:21,z:3,rx:10,rz:8.5,h:4.4},
 {id:8,x:17,z:24,rx:17,rz:11,h:3.0}
];
const PEAKS=[{x:-8,z:-28,h:7,r:3.2},{x:2,z:-30,h:8.5,r:3.4},{x:10,z:-26,h:5,r:2.8},{x:-3,z:-23,h:4.5,r:2.6},{x:-14,z:-25,h:4,r:2.6}];
const MESAS=[{x:16,z:26,h:6.5,r:3.4},{x:24,z:21,h:4.5,r:2.8},{x:10,z:29,h:5.5,r:3.0},{x:27,z:27,h:3.5,r:2.4}];

for(let j=0;j<N;j++)for(let i=0;i<N;i++){
 const x=i-HALF,z=j-HALF,id=j*N+i;
 let maxW=0,sumW=0,sumH=0,swampW=0;
 for(const r of REGIONS){
  const dx=x-r.x,dz=z-r.z;
  const w=Math.exp(-((dx*dx)/(r.rx*r.rx)+(dz*dz)/(r.rz*r.rz))*2.0);
  sumW+=w;sumH+=w*r.h;
  if(w>maxW)maxW=w;
  if(r.id===5)swampW=w;
 }
 let h=sumW>0.001?sumH/sumW:-3;
 h+=(fbm(x*0.14+7.3,z*0.14+2.1)-0.5)*2.4;
 for(const p of PEAKS){const dx=x-p.x,dz=z-p.z;h+=p.h*Math.exp(-(dx*dx+dz*dz)/(2*p.r*p.r));}
 for(const m of MESAS){const dx=x-m.x,dz=z-m.z;const d=Math.sqrt(dx*dx+dz*dz);h+=m.h*(1-sstep(m.r*0.5,m.r,d));}
 const dv=Math.hypot(x+24,z-22);
 if(dv<12){
  const t=dv/12;
  let cone=3+14*Math.pow(Math.max(0,1-t),1.7);
  if(cone>12.8)cone=12.8+(cone-12.8)*0.12;
  if(dv<2.6)cone=12.3;
  const blend=1-sstep(0.7,1.0,t);
  h=h*(1-blend)+cone*blend;
 }
 H[id]=h;
 LAND[id]=(maxW>0.10||dv<11.5)?1:0;
 if(!LAND[id])H[id]=-2.5+(fbm(x*0.2+3,z*0.2+8)-0.5)*1.4;
 let b=0;
 if(LAND[id]){
  let bw=0;
  for(const r of REGIONS){const dx=x-r.x,dz=z-r.z;const w=Math.exp(-((dx*dx)/(r.rx*r.rx)+(dz*dz)/(r.rz*r.rz))*2.0);if(w>bw){bw=w;b=r.id;}}
  if(swampW>0.30&&fbm(x*0.25+9,z*0.25+2)>0.45)b=5;
  if(dv<11.5)b=9;
 }
 BIO[id]=b;
}

/* ---------- rivers / ponds / delta / washes ---------- */
function carveRiver(x,z,bed,o){
 o=o||{};const i=Math.round(x+HALF),j=Math.round(z+HALF);
 if(i<1||j<1||i>=N-1||j>=N-1)return;
 for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){
  const dd=Math.hypot(di,dj);if(dd>1.35)continue;
  const ii=i+di,jj=j+dj,id=jj*N+ii;
  LAND[id]=1;
  const b=bed+dd*0.28;
  if(H[id]>b)H[id]=b;
  if(dd<=0.15||(o.wide&&dd<=1.15)){RIV[id]=1;WTOP[id]=b+0.55;WTYPE[id]=o.murk?1:(o.pond?2:0);}
  if(o.delta&&dd<=2.4)FAN.push([ii,jj]);
 }
}
const FAN=[];
function stampPath(pts,bed0,bed1,o){
 o=o||{};const segs=[];let total=0;
 for(let k=0;k<pts.length-1;k++){const x1=pts[k][0],z1=pts[k][1],x2=pts[k+1][0],z2=pts[k+1][1];
  const l=Math.hypot(x2-x1,z2-z1);segs.push({x1,z1,x2,z2,l,start:total});total+=l;}
 for(let d=0;d<=total;d+=0.35){
  let s=segs[0];for(const sg of segs){if(d<=sg.start+sg.l){s=sg;break;}}
  const tt=s.l>0?clamp((d-s.start)/s.l,0,1):0;
  carveRiver(s.x1+(s.x2-s.x1)*tt,s.z1+(s.z2-s.z1)*tt,bed0+(bed1-bed0)*(d/(total||1)),o);
 }
}
function stampPond(cx,cz,r,bed,wt,type){
 for(let dz=-Math.ceil(r);dz<=Math.ceil(r);dz++)for(let dx=-Math.ceil(r);dx<=Math.ceil(r);dx++){
  if(Math.hypot(dx,dz)>r)continue;
  const i=Math.round(cx+dx+HALF),j=Math.round(cz+dz+HALF);
  if(i<1||j<1||i>=N-1||j>=N-1)continue;
  const id=j*N+i;LAND[id]=1;if(H[id]>bed)H[id]=bed;RIV[id]=1;WTOP[id]=wt;WTYPE[id]=type;
 }
}
/* melt lake + main wet corridor: mountain → conifer → jungle → grassland → delta */
stampPond(-4,-23,1.7,5.7,6.25,2);
stampPath([[-4,-23],[-4,-19],[-5,-14],[-4,-9],[-7,-5],[-9,-1],[-7,3],[-3,7],[0,11],[2,16],[3,21],[4,22]],5.7,1.3,{});
stampPath([[-2,-19],[-3,-15],[-4,-9]],5.2,4.2,{});            /* conifer tributary */
stampPath([[10,4],[5,7],[1,10]],4.5,2.6,{});                  /* highland feeder → plains */
stampPath([[24,-3],[22,1],[21,5]],7.0,4.0,{pond:true});       /* grove feeder */
stampPond(21,5.5,2.2,3.9,4.45,2);
stampPath([[-24,-7],[-21,-8.5],[-18,-7]],1.8,1.6,{murk:true,wide:true});
stampPond(-24,-10.5,1.6,1.5,2.05,1);stampPond(-17,-8,1.4,1.5,2.05,1);
stampPath([[-9,15],[-9,19.5],[-9,22.5]],2.8,1.6,{});          /* grass creek → coastal fall */
/* braided delta */
stampPath([[4,22],[2,24],[0,26],[-1,27.5]],1.3,1.05,{delta:true,wide:true});
stampPath([[4,22],[6,24],[8,26],[9,27.5]],1.3,1.05,{delta:true,wide:true});
stampPath([[4,22],[4,25],[4,27]],1.3,1.05,{delta:true,wide:true});
/* dry desert washes (fade out, no perennial water) */
stampWash([[8,31],[12,28],[15,25.5],[17,24]]);
stampWash([[26,32],[24,28],[22,26]]);
stampWash([[6,26],[9,24],[11,22.5]]);
function stampWash(pts){
 for(let k=0;k<pts.length-1;k++){
  const x1=pts[k][0],z1=pts[k][1],x2=pts[k+1][0],z2=pts[k+1][1];
  const l=Math.hypot(x2-x1,z2-z1),steps=Math.max(2,Math.round(l/0.8));
  for(let s=0;s<=steps;s++){
   const x=x1+(x2-x1)*s/steps,z=z1+(z2-z1)*s/steps;
   const i=Math.round(x+HALF),j=Math.round(z+HALF);if(i<1||j<1||i>=N-1||j>=N-1)continue;
   const id=j*N+i;if(!LAND[id])continue;
   WASH[id]=1;if(H[id]>1.6)H[id]=1.6;
   if(s<3&&rand()<0.5){RIV[id]=1;WTOP[id]=1.95;WTYPE[id]=1;} /* fading puddles near head */
  }
 }
}
/* delta sand bars */
for(const f of FAN){const id=f[1]*N+f[0];if(!RIV[id]){LAND[id]=1;if(H[id]<1.45)H[id]=1.45;}}
/* lava paths → obsidian contact at pond */
function stampLavaPath(pts){
 for(let k=0;k<pts.length-1;k++){
  const x1=pts[k][0],z1=pts[k][1],x2=pts[k+1][0],z2=pts[k+1][1];
  const l=Math.hypot(x2-x1,z2-z1),steps=Math.max(2,Math.round(l/0.45));
  for(let s=0;s<=steps;s++){
   const x=x1+(x2-x1)*s/steps,z=z1+(z2-z1)*s/steps;
   const i=Math.round(x+HALF),j=Math.round(z+HALF);if(i<1||j<1||i>=N-1||j>=N-1)continue;
   const id=j*N+i;if(!LAND[id])continue;
   LAVA.push({x:i-HALF,y:H[id]+0.09,z:j-HALF});
   for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){
    const ii=i+di,jj=j+dj;if(ii<0||jj<0||ii>=N||jj>=N)continue;
    if(Math.hypot(di,dj)<=1.3)LAVA_ADJ[jj*N+ii]=1;
   }
  }
 }
}
const LAVA=[];
stampLavaPath([[-24,22],[-26.5,20.5],[-29,19],[-30.5,18.2]]);
stampLavaPath([[-24,22],[-21.5,24],[-19,25.5],[-17.5,24.5],[-16.5,21],[-16.2,18.6]]);
LAVA.push({x:-30.5,y:H[Math.round(18.2+HALF)*N+Math.round(-30.5+HALF)]+0.09,z:18.2});
/* obsidian pond where water meets lava */
stampPond(-14,17.5,2.1,2.3,2.85,2);
for(let dz=-2;dz<=2;dz++)for(let dx=-2;dx<=2;dx++){
 if(Math.hypot(dx,dz)>1.5)continue;
 const i=Math.round(-16.3+dx+HALF),j=Math.round(18.3+dz+HALF);
 if(i<0||j<0||i>=N||j>=N)continue;OBS[j*N+i]=1;
}

/* ---------- BFS distances ---------- */
function bfs(isSrc){
 const dist=new Int16Array(N*N).fill(-1);const q=[];
 for(let id=0;id<N*N;id++)if(isSrc(id)){dist[id]=0;q.push(id);}
 let head=0;
 while(head<q.length){
  const id=q[head++],i=id%N,j=(id/N)|0,d=dist[id]+1;
  if(i>0&&dist[id-1]<0){dist[id-1]=d;q.push(id-1);}
  if(i<N-1&&dist[id+1]<0){dist[id+1]=d;q.push(id+1);}
  if(j>0&&dist[id-N]<0){dist[id-N]=d;q.push(id-N);}
  if(j<N-1&&dist[id+N]<0){dist[id+N]=d;q.push(id+N);}
 }
 return dist;
}
const distLand=bfs(id=>LAND[id]===1);
const distOcean=bfs(id=>LAND[id]===0);
/* coastal beach shelf */
for(let id=0;id<N*N;id++){
 if(!LAND[id]||BIO[id]===9)continue;
 const dO=distOcean[id];
 if(dO<=2&&H[id]>2.1)H[id]=lerp(H[id],2.15,(2.2-dO)/1.4*0.85);
}
for(let id=0;id<N*N;id++){
 if(!LAND[id])continue;
 const h=H[id],dO=distOcean[id];
 const beach=h<2.3||(dO<=1&&h<3.1);
 if(beach)BIO[id]=(BIO[id]===9)?11:10;
}
for(let id=0;id<N*N;id++){
 if(!RIV[id])continue;
 const i=id%N,j=(id/N)|0;
 for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){
  const ii=i+di,jj=j+dj;if(ii<0||jj<0||ii>=N||jj>=N)continue;
  if(Math.hypot(di,dj)<=1.4)LUSH[jj*N+ii]=1;
 }
}

/* ---------- colors ---------- */
const C={sand:0xe6d7ae,wetSand:0xc9b285,darkSand:0x3c3a42,mtnSnow:0xeef3f8,mtnRock:0x878f9a,mtnLow:0x6e7681,
 coniferGround:0xd7e2d8,pineSoil:0x8a7a64,highland:0x8b9a72,highlandRock:0x767c70,jungle:0x2f9e4f,
 jungleDark:0x1d7a3c,jungleLight:0x4cb463,swamp:0x6b7442,desert:0xe2b563,dune:0xedc47c,wash:0xc99a5e,
 mesaTop:0xc98d54,basalt:0x3a3e46,ashC:0x565b64,scorched:0x232028,obsidian:0x1b1522,dirt:0x7d5f42,
 sandDark:0xc9b285,sandstone:0xc99a5e,snowyDirt:0x9c8f7a,gravel:0x9c9278};
const SEASON_GRASS=[0x6cb84f,0x5da244,0xb0a05c,0xc9cfae];
const SEASON_MEADOW=[0xa9c98d,0x9cbd7c,0xc2b083,0xcfc9a8];
const SEASON_CONIFER=[0xc2d2b8,0xd7e2d8,0xcfd6c8,0xe9f0f6];
const cTmp=new THREE.Color(),cTmp2=new THREE.Color();
function topColor(id,x,z,si=0){
 const b=BIO[id],h=H[id];
 const n1=fbm(x*0.35+11,z*0.35+4),n2=fbm(x*0.9+31,z*0.9+17);
 switch(b){
  case 1:{const sl=si===3?10.6:11.2;
   if(h>=sl)return cTmp.set(C.mtnSnow);
   if(h>=8.4)return cTmp.set(C.mtnRock).lerp(cTmp2.set(C.mtnSnow),n1>0.62?0.9:0);
   return cTmp.set(C.mtnLow).lerp(cTmp2.set(C.mtnRock),n1*0.6);}
  case 2:return cTmp.set(SEASON_CONIFER[si]).lerp(cTmp2.set(C.pineSoil),n1>0.62?1:0);
  case 3:return cTmp.set(C.highland).lerp(cTmp2.set(C.highlandRock),n1>0.55?0.8:0);
  case 4:return cTmp.set(C.jungle).lerp(cTmp2.set(C.jungleDark),n1).lerp(cTmp2.set(C.jungleLight),LUSH[id]?0.5:0);
  case 5:return cTmp.set(C.swamp).lerp(cTmp2.set(0x4d5a33),n2>0.6?0.5:0);
  case 6:{cTmp.set(SEASON_GRASS[si]);
   if(n1>0.6)cTmp.multiplyScalar(0.82);
   if(n2>0.86)cTmp.lerp(cTmp2.set(0xf0e28a),0.55);
   return cTmp;}
  case 7:{cTmp.set(SEASON_MEADOW[si]);
   if(n1>0.58)cTmp.lerp(cTmp2.set(0xe9a3c0),0.7);
   return cTmp;}
  case 8:if(WASH[id])return cTmp.set(C.wash);
   if(h>6.5)return cTmp.set(C.mesaTop).lerp(cTmp2.set(C.desert),n1*0.5);
   return cTmp.set(C.desert).lerp(cTmp2.set(C.dune),n1);
  case 9:if(OBS[id])return cTmp.set(C.obsidian).lerp(cTmp2.set(0x3a2a4a),n2*0.4);
   if(LAVA_ADJ[id])return cTmp.set(C.scorched).lerp(cTmp2.set(C.basalt),n1*0.6);
   return cTmp.set(C.basalt).lerp(cTmp2.set(C.ashC),n1>0.6?0.8:0);
  case 10:return cTmp.set(distOcean[id]===1?C.wetSand:C.sand).lerp(cTmp2.set(C.wetSand),n1*0.3);
  case 11:return cTmp.set(C.darkSand).lerp(cTmp2.set(0x26222a),n1*0.5);
 }
 return cTmp.set(0x888888);
}
function sideColor(id,x,z,k){
 const b=BIO[id];
 if(b===9||b===11)return cTmp.set(k<-1?0x2f333a:0x3a3e46);
 if(b===8)return cTmp.set(C.sandstone);

function sampleCells(ids,n,minH,maxH,slope){

 while(out.length<n&&guard++<12000){

  if(!LAND[id]||!ids.includes(BIO[id]))continue;

 }

}

  :lam(color,{transparent:true,opacity:opts.opacity||0.85,depthWrite:false});

function updateFall(sys,dt,box,windX,streak){
 const active=Math.floor(sys.n*clamp(sys.intensity,0,1));
 for(let i=0;i<active;i++){
  const p=sys.P[i];
  p.y-=p.vy*dt;p.x+=windX*dt*(0.6+p.vz);
  if(p.y<box.y0||p.x>box.x1){p.x=box.x0+rand()*(box.x1-box.x0);p.y=box.y0+rand()*(box.y1-box.y0)*0.4+box.y1*0.6;p.z=box.z0+rand()*(box.z1-box.z0);}
  dummy.position.set(p.x,p.y,p.z);dummy.scale.set(p.s,p.s*streak,p.s);dummy.rotation.set(0,0,0);dummy.updateMatrix();
  sys.mesh.setMatrixAt(i,dummy.matrix);
 }
 sys.mesh.count=active;sys.mesh.instanceMatrix.needsUpdate=true;
}

  u.offs.forEach((o,k)=>{
   const dx=((o.seed+drift)%R+R)%R-R/2;
   dummy.position.set(u.cx+dx,o.oy,u.cz+o.oz);dummy.scale.set(o.s,o.s*0.55,o.s);dummy.rotation.set(0,0,0);dummy.updateMatrix();
   deck.setMatrixAt(k,dummy.matrix);
  });
  deck.instanceMatrix.needsUpdate=true;
 });

 /* --- mist --- */
 mists.forEach(ms=>{
  ms.m.position.x=ms.x+Math.sin(t*0.12+ms.ph)*1.6;
  ms.m.position.z=ms.z+Math.cos(t*0.1+ms.ph)*1.4;
  ms.m.material.opacity=ms.op*(0.6+0.4*Math.sin(t*0.4+ms.ph));
 });

 /* --- fauna --- */
 animals.forEach(a=>{
  a.yaw+=Math.sin(t*a.yawSpd+a.ph)*dt*0.4;
  a.x+=Math.sin(a.yaw)*a.sp*dt;a.z+=Math.cos(a.yaw)*a.sp*dt;
  const g=gAt(a.x,a.z);
  a.g.position.set(a.x,g+Math.abs(Math.sin(t*1.6+a.ph))*0.07,a.z);
  a.g.rotation.y=a.yaw;
 });
 birds.forEach(b=>{
  b.ang+=b.sp*dt;
  const x=b.cx+Math.cos(b.ang)*b.r,z=b.cz+Math.sin(b.ang)*b.r,y=b.cy+Math.sin(t*0.8+b.ph)*0.6;
  b.g.position.set(x,y,z);b.g.rotation.y=-b.ang+(b.sp>0?0:Math.PI);
  const flap=Math.sin(t*9+b.ph)*0.55;
  b.wl.rotation.z=flap;b.wr.rotation.z=-flap;
 });

 /* --- camera fly --- */
 if(camAnim){
  camAnim.t+=dt/camAnim.dur;
  const k=easeIO(Math.min(1,camAnim.t));
  camera.position.lerpVectors(camAnim.p0,camAnim.p1,k);
  controls.target.lerpVectors(camAnim.t0,camAnim.t1,k);
  if(camAnim.t>=1)camAnim=null;
 }
 controls.update();

 /* --- HUD text --- */
 applySeason(Math.floor((t/SEASON_LEN)%1*4)%4);
 const tod=elev>0.3?'DAY':(elev>-0.05?'TWILIGHT':'NIGHT');
 if(tod!==lastTod){lastTod=tod;todEl.textContent=tod;}
 wxTimer+=dt;
 if(wxTimer>0.3){
  wxTimer=0;
  const tags=[];
  if(rainJ.intensity>0.35)tags.push('Jungle rain');
  if(rainH.intensity>0.35)tags.push('Highland showers');
  if(rainG.intensity>0.35)tags.push('Grove drizzle');
  if(snow.intensity>0.35)tags.push('Snowfall');
  if(blizI>0.35)tags.push('Blizzard');
  if(sandI>0.35)tags.push('Sandstorm');
  if(ash.intensity>0.4)tags.push('Ash fall');
  if(eruptI>0.25)tags.push('Eruption!');
  wxEls.textContent=tags.length?'WEATHER · '+tags.join(' · '):'WEATHER · CALM SKIES';
 }

 renderer.render(scene,camera);
}
applySeason(0);
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
</body>
</html>
