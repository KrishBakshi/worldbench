.hd{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.12);

.hd button{all:unset;cursor:pointer;width:18px;height:18px;text-align:center;line-height:18px;border:1px solid rgba(255,255,255,.2);color:#dfe6ee}

.sw{width:14px;height:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.nm{color:#eef3f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx{font-size:10px;color:#8fd8ff;opacity:.35;transition:opacity .4s;white-space:nowrap}
.ft{padding:7px 10px 8px;border-top:1px solid rgba(255,255,255,.12);font-size:10px;color:#8b98a8}
#legend.min #list,#legend.min .ft{display:none}
#clock{right:12px;top:12px;padding:9px 12px 10px;min-width:150px}
.lbl{font-size:10px;letter-spacing:.14em;color:#9fb0c2}
#season{font-size:22px;letter-spacing:.06em;margin:1px 0 6px;color:#fff}
#sbar{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-bottom:8px}
#sbar i{height:5px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}
#sbar i b{position:absolute;left:0;top:0;bottom:0;width:0}
#tod{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#sunic{width:11px;height:11px;background:#ffe9a0}
#spd{display:flex;gap:4px}
#spd button{all:unset;cursor:pointer;flex:1;text-align:center;padding:2px 0;border:1px solid rgba(255,255,255,.2);font-size:10px}
#spd button:hover{background:rgba(255,255,255,.12)}
#spd button.on{background:#dfe6ee;color:#05070a;border-color:#dfe6ee}
#cap{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:min(620px,calc(100% - 32px));padding:8px 14px;text-align:center;
  background:rgba(6,8,12,.76);border:1px solid rgba(255,255,255,.14);opacity:0;transition:opacity .5s;pointer-events:none}
#cap b{color:#fff;letter-spacing:.08em}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;letter-spacing:.2em;color:#9fb0c2;pointer-events:none}

const sstep=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+1013|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vnoise(x*f,y*f);a*=.5;f*=2.03}return s/.9375}
const ridged=(x,y)=>1-Math.abs(2*fbm(x,y)-1);
const C=h=>{const f=c=>{c/=255;return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)};return[f(h>>16&255),f(h>>8&255),f(h&255)]};
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const shade=(a,f)=>[a[0]*f,a[1]*f,a[2]*f];
const rnd=mulberry32(20240611);
const rc=arr=>arr[(rnd()*arr.length)|0];

/* ============================================================
   WORLD GRID
   x: west -> east, z: north (far / behind) -> south (near)
   ============================================================ */
const W=288,D=240,N=W*D,SL=5;
const U=u=>u*W-W/2,V=v=>v*D-D/2;
const B={VOID:0,OCEAN:1,BEACH:2,GRASS:3,JUNGLE:4,SWAMP:5,SNOWF:6,HIGH:7,GROVE:8,DESERT:9,VOLC:10,MOUNT:11};
const F_CLEAR=1,F_REEF=2,F_WASH=4,F_ISLET=8,F_ROCKY=16,F_OBS=32,F_MESA=64,F_POND=128;
const H=new Float32Array(N),BOT=new Float32Array(N),FTOP=new Float32Array(N),SHORE=new Float32Array(N),DM=new Float32Array(N),W2=new Float32Array(N);
const BIO=new Uint8Array(N),UB=new Uint8Array(N),B2=new Uint8Array(N),FL=new Uint8Array(N),FLAG=new Uint8Array(N),NEAR=new Uint8Array(N);
const COL=new Float32Array(N*3),SCOL=new Float32Array(N*3),FCOL=new Float32Array(N*3);
const cellAt=(x,z)=>{const cx=Math.floor(x+W/2),cz=Math.floor(z+D/2);return(cx<0||cz<0||cx>=W||cz>=D)?-1:cx+cz*W};

const P={
 grass:C(0x6fae48),olive:C(0x8da63e),lush:C(0x4f9c3c),marsh:C(0xb7c27c),fYel:C(0xf4dc48),fWht:C(0xf6f6ea),
 jung:C(0x1f7d3d),jungD:C(0x13602f),jrock:C(0x7f867c),moss:C(0x5c7c50),
 swamp:C(0x5e6534),swampD:C(0x474f2a),mud:C(0x4b4530),
 snow:C(0xf6f9fc),snowB:C(0xdde7f1),white:C(0xffffff),
 high:C(0x8a9c7c),highD:C(0x74876b),hrock:C(0x8e908b),heath:C(0x9079aa),
 grove:C(0xeab0ca),groveD:C(0xdd9cbd),groveG:C(0xb9d298),petal:C(0xfbd3e4),
 sand:C(0xe6bd5e),ochre:C(0xd49b3e),wash:C(0xb98a45),washD:C(0xa5773a),
 sandst:[C(0xc9703a),C(0xdb8c4c),C(0xb85c32),C(0xe2a262)],
 basalt:C(0x1e1c1f),basalt2:C(0x2c282a),burnt:C(0x40201a),ash:C(0x4c484a),ember:C(0x7a2a12),obs:C(0x120b1c),obsP:C(0x2c1846),
 rock:C(0x7b8aa3),rockD:C(0x64738b),
 beach:[C(0xf3e4b4),C(0xfbf4dc),C(0xe4cd98)],brock:C(0x8d9196),brockD:C(0x74787e),
 seabed:C(0xcfc392),lagoon:C(0x52e0cf),cyan:C(0x28b4dc),deep:C(0x1560b4),reefW:C(0x8ff2de),fresh:C(0x86dcc6),
 river:C(0x3ccbec),riverJ:C(0x34bfc0),melt:C(0xa6e8f6),murk:C(0x3f4d2f),foam:C(0xc8f2ff),
 lava:[C(0xe23a0c),C(0xff6a10),C(0xffb52e)],
 dirt:C(0x7a5a3a),dirtJ:C(0x4f3a26),dirtS:C(0x3d3a26),dirtH:C(0x6f6a5c),dirtG:C(0x8a5f58),
 stone:C(0x77706a),mstone:C(0x6f7d92),vstone:C(0x262226),cstone:C(0x9a9484),under:C(0x6f757e),underD:C(0x3a3e48),
 trunkJ:C(0x5b3a1e),trunkP:C(0x4a3320),trunkO:C(0x6b4a2a),trunkC:C(0x4b2e2a),trunkM:C(0x5a4a34),palmT:C(0x9a7b4f),
 jleaf:[C(0x1fa055),C(0x178a48),C(0x0f6e3a),C(0x2bb866),C(0x1c9450)],vine:C(0x2f7a32),fern:C(0x3fae5a),
 pine:[C(0x1f4d3a),C(0x1a4433),C(0x265a44)],
 oak:[C(0x4f9a3a),C(0x5aa544),C(0x468c34)],
 blossom:[C(0xf48fb1),C(0xf8a9c8),C(0xfcc6dc),C(0xee7fa8)],
 palmL:C(0x3fa650),cactus:C(0x3f8f4a),cactusD:C(0x357c40),deadb:C(0x8a6a42),
 mang:[C(0x4f6b2f),C(0x5d7a35),C(0x445f2b)],reed:C(0x9a9a52),lily:C(0x5f9a44),
 scrub:[C(0x7a8c66),C(0x66785a),C(0x8a9670)],grey:C(0x8d8f8a),greyD:C(0x6c6e6a),char:C(0x15110f),
 coral:[C(0xff7f9a),C(0xffa24a),C(0xb07cff),C(0xfff0b0)],glow:C(0x4fc3ff)
};

/* ---------- biome seeds (u,v) : warped Voronoi regions ---------- */
const SEEDS=[
 [B.MOUNT,.25,.14],[B.MOUNT,.40,.10],[B.MOUNT,.55,.10],[B.MOUNT,.69,.13],
 [B.SNOWF,.27,.31],[B.SNOWF,.40,.30],[B.SNOWF,.50,.30],
 [B.HIGH,.64,.30],[B.HIGH,.72,.36],[B.HIGH,.62,.38],[B.HIGH,.775,.50],[B.HIGH,.83,.61],
 [B.VOLC,.865,.37],[B.VOLC,.88,.48],[B.VOLC,.85,.25],
 [B.GROVE,.66,.54],[B.GROVE,.74,.57],
 [B.JUNGLE,.30,.46],[B.JUNGLE,.36,.56],[B.JUNGLE,.26,.58],[B.JUNGLE,.42,.47],
 [B.SWAMP,.165,.44],[B.SWAMP,.16,.56],
 [B.GRASS,.40,.72],[B.GRASS,.50,.68],[B.GRASS,.32,.76],[B.GRASS,.52,.80],[B.GRASS,.44,.87],[B.GRASS,.35,.88],
 [B.DESERT,.70,.76],[B.DESERT,.80,.72],[B.DESERT,.68,.88],[B.DESERT,.80,.86],[B.DESERT,.88,.74]
].map(s=>[s[0],s[1]*W,s[2]*D]);

const VCX=.865*W,VCZ=.37*D,VR=27,CR=5,CRATER=40;
const PEAKS=[[.24,.135,26,22],[.33,.10,34,25],[.43,.115,42,27],[.53,.095,33,24],[.62,.115,38,26],[.705,.14,24,20]];
const MESAS=[[.735,.745,13,15],[.80,.805,10,19],[.685,.845,8,10],[.865,.765,9,12],[.70,.69,6,8]];

function mountainExtra(x,z){let m=0;for(const p of PEAKS){const r=Math.hypot(x-p[0]*W,z-p[1]*D)/p[3];if(r<1)m=Math.max(m,p[2]*Math.pow(1-r,1.25))}
  const rg=ridged(x*.045,z*.045);return m*(.8+.3*rg)+rg*rg*7}
function mesaExtra(x,z){let m=0;for(const p of MESAS){const r=Math.hypot(x-p[0]*W,z-p[1]*D)/p[2]+(vnoise(x*.2,z*.2)-.5)*.25;
  if(r<1){const s=sstep(0,.55,1-r);m=Math.max(m,Math.round(s*4)/4*p[3])}}return m}
function baseH(b,x,z,u,v){
  switch(b){
    case B.GRASS:return 8+(fbm(x*.05,z*.05)-.5)*1.4;
    case B.JUNGLE:return 10.5+fbm(x*.045+9,z*.045+5)*4+((v+(vnoise(x*.08,5.5)-.5)*.02)<.445?8:0);
    case B.SWAMP:return 6.2+(fbm(x*.08,z*.08)-.5)*1.2;
    case B.SNOWF:return 21+fbm(x*.05+3,z*.05+8)*4.5;
    case B.HIGH:{const hills=Math.max(0,fbm(x*.09+40,z*.09+12)-.55)*22;
      return 18-5*sstep(.36,.47,v)+6*sstep(.53,.6,v)*sstep(.74,.8,u)+(fbm(x*.06+2,z*.06+6)-.5)*4+hills}
    case B.GROVE:return 9+(fbm(x*.06+15,z*.06+25)-.5)*2;
    case B.DESERT:return 8+(fbm(x*.07+50,z*.035+20)-.45)*3;
    case B.VOLC:return 9+fbm(x*.11+70,z*.11+80)*3;
    case B.MOUNT:return 26;
  }
  return 8;
}

/* ---------- pass 1: island mask, biomes, heights ---------- */
{
  const dB=new Float32Array(12);
  for(let z=0;z<D;z++)for(let x=0;x<W;x++){
    const i=x+z*W,u=(x+.5)/W,v=(z+.5)/D,nx=u*2-1,nz=v*2-1;
    let d=Math.pow(Math.pow(Math.abs(nx),2.5)+Math.pow(Math.abs(nz),2.5),.4)+(fbm(x*.022+31,z*.022+17)-.5)*.13;
    if(d<0)d=0;
    DM[i]=d;if(d>=1)continue;
    const wx=x+(fbm(x*.03+7,z*.03+3)-.5)*28,wz=z+(fbm(x*.03+71,z*.03+43)-.5)*28;
    dB.fill(1e9);
    for(const s of SEEDS){const dd=Math.hypot(wx-s[1],wz-s[2]);if(dd<dB[s[0]])dB[s[0]]=dd}
    const rv=Math.hypot(x+.5-VCX,z+.5-VCZ);
    dB[B.VOLC]=Math.min(dB[B.VOLC],rv-20);
    let dmin=1e9,b1=3;for(let b=3;b<12;b++)if(dB[b]<dmin){dmin=dB[b];b1=b}
    let h=0,ws=0,wM=0,wD=0,b2=0,w2=0;
    for(let b=3;b<12;b++){const w=Math.exp(-(dB[b]-dmin)/5);if(w<.01)continue;h+=w*baseH(b,x,z,u,v);ws+=w;
      if(b===B.MOUNT)wM=w;else if(b===B.DESERT)wD=w;if(b!==b1&&w>w2){w2=w;b2=b}}
    h/=ws;
    h+=mountainExtra(x,z)*sstep(.3,.8,wM/ws);
    const ms=mesaExtra(x,z)*sstep(.35,.75,wD/ws);h+=ms;if(ms>1.5&&b1===B.DESERT)FLAG[i]|=F_MESA;
    if(rv<VR){const cone=9+48*Math.pow(1-rv/VR,1.4)+(vnoise(x*.3,z*.3)-.5)*1.6;h=Math.max(h,cone);if(rv<CR)h=CRATER}
    B2[i]=b2;W2[i]=w2;
    // coast: ocean ring wraps the south and west
    const th=Math.atan2(nz,nx);let df=Math.abs(th-2.42);if(df>Math.PI)df=2*Math.PI-df;
    const ow=1-sstep(1.25,1.75,df);
    const delta=v>.5?Math.exp(-Math.pow((u-.41)/.085,2)):0;
    const landR=1-ow*(.22+(fbm(x*.035+90,z*.035+60)-.5)*.10)+delta*.045*ow;
    if(d>=landR){
      const sd=(d-landR)/(1-landR+1e-6);SHORE[i]=sd;BIO[i]=B.OCEAN;UB[i]=b1;
      h=sd<.18?4:sd<.45?3:sd<.75?2:1;
      const isl=fbm(x*.09+200,z*.09+100),rf=fbm(x*.11+300,z*.11+400);
      if(sd>.25&&sd<.8&&isl>.7){BIO[i]=B.BEACH;UB[i]=B.GRASS;FLAG[i]|=F_ISLET;h=SL+1+(isl>.75?1:0)+(isl>.8?1:0)}
      else if(sd>.12&&sd<.7&&rf>.66){FLAG[i]|=F_REEF;h=4}
    }else if(ow>.1&&d>landR-.05){
      BIO[i]=B.BEACH;UB[i]=b1;const t=(landR-d)/.05;let hb=SL+(h-SL)*t*t*.8;
      const hn=fbm(x*.06+500,z*.06+600),cold=b1===B.SNOWF||b1===B.MOUNT;
      if(hn>.62||cold){FLAG[i]|=F_ROCKY;hb+=hn>.62?1+(hn>.68?1:0):(hash2(x,z)<.3?1:0)}
      h=Math.max(SL,hb);
    }else{
      BIO[i]=b1;h=Math.max(h,SL+1);
      if(b1===B.JUNGLE&&fbm(x*.07+140,z*.07+160)>.68){FLAG[i]|=F_CLEAR;h+=1}
    }
    H[i]=Math.round(h);
    BOT[i]=-Math.round(14+48*(1-Math.pow(Math.min(1,d),1.6))+.4*H[i]+(fbm(x*.06+800,z*.06+900)-.5)*16+Math.pow(vnoise(x*.23+5,z*.23+9),4)*20);
  }
}
const H0=H.slice();

/* ---------- pass 2: hydrology (water obeys the wet corridor) ---------- */
function samplePath(pts,step=.5){
  const Q=pts.map(p=>[p[0]*W,p[1]*D]),out=[];
  for(let i=0;i<Q.length-1;i++){
    const p0=Q[Math.max(0,i-1)],p1=Q[i],p2=Q[i+1],p3=Q[Math.min(Q.length-1,i+2)];
    const n=Math.max(1,Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/step));
    for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;
      const f=a=>.5*(2*p1[a]+(-p0[a]+p2[a])*t+(2*p0[a]-5*p1[a]+4*p2[a]-p3[a])*t2+(-p0[a]+3*p1[a]-3*p2[a]+p3[a])*t3);
      out.push([f(0),f(1)])}
  }
  out.push(Q[Q.length-1]);return out;
}
function meander(S,amp,ph){
  const n=S.length,out=new Array(n);
  for(let k=0;k<n;k++){const a=S[Math.max(0,k-2)],b=S[Math.min(n-1,k+2)];let tx=b[0]-a[0],tz=b[1]-a[1];const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
    const tp=Math.sin(Math.PI*k/(n-1));const o=(Math.sin(k*.11+ph)+.6*Math.sin(k*.047+ph*2.3))*amp*Math.min(1,tp*3);
    out[k]=[S[k][0]-tz*o,S[k][1]+tx*o]}
  return out;
}
const mouths=[],falls=[];
let riverSeq=0;
function carveWater(pts,w0,w1,m){
  const S=meander(samplePath(pts),m,(riverSeq++)*1.9+.4),n=S.length;let L=1e9;
  for(let k=0;k<n;k++){
    const sx=S[k][0],sz=S[k][1],cx=Math.floor(sx),cz=Math.floor(sz);
    if(cx<0||cz<0||cx>=W||cz>=D)break;
    const ci=cx+cz*W;if(!BIO[ci])break;
    if(BIO[ci]===B.OCEAN){mouths.push([sx,sz]);break}
    const prevL=L;L=Math.max(SL-1,Math.min(L,H0[ci]-1));
    if(FL[ci]===1&&FTOP[ci]-.75<L)L=FTOP[ci]-.75;
    if(prevL<1e8&&prevL-L>=3)falls.push({x:sx,z:sz,top:prevL+.75,len:prevL-L});
    const r=lerp(w0,w1,k/(n-1))/2,R=Math.ceil(r);
    for(let dz=-R;dz<=R;dz++)for(let dx=-R;dx<=R;dx++){
      if(dx*dx+dz*dz>r*r+.3)continue;const xx=cx+dx,zz=cz+dz;if(xx<0||zz<0||xx>=W||zz>=D)continue;
      const j=xx+zz*W;if(!BIO[j]||BIO[j]===B.OCEAN||FL[j])continue;
      H[j]=Math.max(SL-1,Math.min(H0[j]-1,L));FL[j]=1;FTOP[j]=H[j]+.75;
    }
  }
}

  const jr=burst(T,46,0,5,20,6)*sv(SV.jr),jc=burst(T+2.5,46,0,5,25,7);
  deckJ.g.position.set(deckJ.hx+Math.sin(T*.05)*11,46,deckJ.hz+Math.cos(T*.04)*7);setDeck(deckJ,jc,.9);rainJ.upd(T,jr);
  mistJ.upd(T,.14+.86*burst(T+22,46,0,4,11,9),.34);
  // snowy conifer forest: snowfall from its own cloud deck
  const sn=burst(T,52,10,6,24,7)*sv(SV.sn),sc=burst(T+2.5,52,10,6,29,8);
  deckS.g.position.set(deckS.hx+Math.sin(T*.045+1)*9,50,deckS.hz+Math.cos(T*.05)*3);setDeck(deckS,sc,.45);snowS.upd(T,sn);
  // highlands: occasional mist and light rain
  const hr=burst(T,64,20,5,12,6)*sv(SV.hr),hc=burst(T+2.5,64,20,5,17,7);
  deckH.g.position.set(deckH.hx+Math.sin(T*.06+2)*7,44,deckH.hz+Math.cos(T*.05+1)*5);setDeck(deckH,hc,.6);rainH.upd(T,hr*.8);
  mistH.upd(T,burst(T,64,8,6,22,8)*.9,.3);
  // plains shower that drifts on to the grove
  const sh=burst(T,80,45,5,14,6)*sv(SV.sh),pc=burst(T+2.5,80,45,5,19,7),dr=.5+.5*Math.sin(T*.05);
  deckP.g.position.set(lerp(U(.43),U(.66),dr),38,lerp(V(.74),V(.56),dr));setDeck(deckP,pc,.7);rainP.upd(T,sh);
  // swamp low mist
  const sm=burst(T,60,15,8,30,10);mistS.upd(T,sm,.3);
  // blizzard on the rear alpine face
  const bz=burst(T,58,8,5,22,7)*sv(SV.bz);bz1.upd(T,bz,.6);bz2.upd(T,bz,.85);bz3.upd(T,bz,.16);
  // desert sandstorm
  const ss=burst(T,70,5,6,18,8)*sv(SV.ss);ss1.upd(T,ss,.6);ss2.upd(T,ss,.8);ss3.upd(T,ss,.15);
  // volcano
  const er=burst(T,55,38,2,9,5);ashP.upd(T,er);bombs.upd(T,er);ashF.upd(T,burst(T,55,34,4,12,8));
  lavaL.intensity=(2400+9000*er)*(.85+.15*Math.sin(T*9)*Math.sin(T*5.3));
  // water cycle: heat-driven evaporation, petals, quench steam
  const ev=clamp(sunH*1.3,0,1)*sv(SV.ev);evap.upd(T,ev,.5);
  petals.upd(T,sv(SV.pt),.9);steamP.upd(T,1,.55);
  foam.upd(T);lavaDrops.upd(T);
  WX.mount=bz;WX.snowf=sn;WX.high=Math.max(hr,burst(T,64,8,6,22,8)*.6);WX.jungle=jr;WX.swamp=sm;WX.grass=sh*(1-dr);WX.grove=Math.max(sh*dr,sv(SV.pt)*.6);
  WX.desert=ss;WX.volc=Math.max(er,.25);WX.coast=ev;WX.under=1;WX.all=0;
}

const listEl=document.getElementById('list'),capEl=document.getElementById('cap'),wxEls={};
let fly=null,capTimer=0;
const vT=new THREE.Vector3(),vP=new THREE.Vector3();
function viewOf(L,out,tgt){const k=camera.aspect<1?1.55:camera.aspect<1.35?1.2:1;tgt.set(L.t[0],L.t[1],L.t[2]);out.set(L.t[0]+L.o[0]*k,L.t[1]+L.o[1]*k,L.t[2]+L.o[2]*k)}
function flyTo(L){
  viewOf(L,vP,vT);
  fly={t:0,dur:1.9,p0:camera.position.clone(),t0:controls.target.clone(),p1:vP.clone(),t1:vT.clone()};
  fly.lift=Math.min(70,fly.p0.distanceTo(fly.p1)*.12);
  for(const li of listEl.children)li.classList.toggle('on',li.dataset.k===L.k);
  capEl.innerHTML='<b>'+L.n.toUpperCase()+'</b> — '+L.d;capEl.style.opacity=1;clearTimeout(capTimer);capTimer=setTimeout(()=>capEl.style.opacity=0,9000);
}
LEG.forEach((L,i)=>{
  const li=document.createElement('li');li.dataset.k=L.k;if(i===0)li.className='sep on';
  const bg=L.c2?'linear-gradient(135deg,'+L.c+' 50%,'+L.c2+' 50%)':L.c;
  li.innerHTML='<span class="sw" style="background:'+bg+'"></span><span class="nm">'+L.n+'</span><span class="wx">'+L.w+'</span>';
  li.addEventListener('click',()=>flyTo(L));listEl.appendChild(li);wxEls[L.k]=li.querySelector('.wx');
});

for(const b of document.querySelectorAll('#spd button'))b.addEventListener('click',()=>{speed=+b.dataset.s;for(const c of document.querySelectorAll('#spd button'))c.classList.toggle('on',c===b)});
const cancelFly=()=>{fly=null};
renderer.domElement.addEventListener('pointerdown',cancelFly);renderer.domElement.addEventListener('wheel',cancelFly,{passive:true});
const seasonEl=document.getElementById('season'),todEl=document.getElementById('todt'),sunIc=document.getElementById('sunic'),bars=[...document.querySelectorAll('#sbar i b')];
let hudN=0,lastS=-1;
function updateHUD(){
  if(lastS!==sI){lastS=sI;seasonEl.textContent=SNAME[sI];seasonEl.style.color=SCOLR[sI]}
  if((hudN++%6)!==0)return;
  bars.forEach((b,k)=>{b.style.background=SCOLR[k];b.style.width=(k<sI?100:k===sI?sF*100:0)+'%'});
  const tod=sunH>.8?'Noon':sunH>.22?'Day':sunH>-.12?(dayP<.31||dayP>.9?'Dawn':'Dusk'):'Night';
  todEl.textContent=tod;sunIc.style.background=sunH>.22?'#ffe9a0':sunH>-.12?'#ff9a4a':'#6f82b8';

const clock=new THREE.Clock();let simT=window.__WB_TIME?.tod!=null?window.__WB_TIME.tod*96:0;
function frame(){
  requestAnimationFrame(frame);
  const rdt=Math.min(clock.getDelta(),.1),dt=rdt*speed;simT+=dt;uTime.value=simT;
  updateSky(simT);updateWeather(simT);updateFauna(simT,dt);
  for(let k=0;k<3;k++)fragGroups[k].position.y=Math.sin(simT*.35+k*2.1)*1.6;
  if(fly){
    fly.t=Math.min(1,fly.t+rdt/fly.dur);const e=fly.t<.5?4*fly.t*fly.t*fly.t:1-Math.pow(-2*fly.t+2,3)/2;
    camera.position.lerpVectors(fly.p0,fly.p1,e);camera.position.y+=Math.sin(Math.PI*e)*fly.lift;
    controls.target.lerpVectors(fly.t0,fly.t1,e);if(fly.t>=1)fly=null;
  }

}
