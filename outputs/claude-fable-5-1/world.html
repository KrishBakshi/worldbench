<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;color:#d8dde6}
  canvas{display:block}
  #hud{position:fixed;left:12px;top:12px;background:rgba(8,10,14,.74);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.35;width:236px;backdrop-filter:blur(4px)}
  #hud h1{font-size:12px;margin:0 0 6px;letter-spacing:.08em;text-transform:uppercase;color:#fff}
  .entry{display:flex;align-items:center;gap:8px;padding:3px 5px;border-radius:4px;cursor:pointer;user-select:none}
  .entry:hover{background:rgba(255,255,255,.10)}
  .entry.active{background:rgba(255,255,255,.18)}
  .sw{width:13px;height:13px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.55)}
  .nm{flex:1;white-space:nowrap}
  .wx{opacity:.55;font-size:10px;white-space:nowrap}
  #foot{margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.12);opacity:.62;font-size:10.5px;line-height:1.5}
  #season{position:fixed;right:12px;top:12px;background:rgba(8,10,14,.74);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:8px 12px;font-size:11.5px;text-align:right;min-width:150px;backdrop-filter:blur(4px)}
  #season b{display:block;font-size:17px;color:#fff;letter-spacing:.05em}

<body>
<div id="hud">
  <h1>Biome Legend</h1>
  <div id="legend"></div>
  <div id="foot">Drag: orbit &nbsp;·&nbsp; Wheel: zoom &nbsp;·&nbsp; Right‑drag: pan<br>Click a biome to fly there.</div>
</div>
<div id="season"><b id="seasonName">Spring</b><span id="timeName">Noon · Day 1</span></div>
<div id="loading">CARVING THE ISLAND…</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================== utilities ============================== */
let seed = 90210;
function rnd(){ seed=(seed+0x6D2B79F5)|0; let t=seed; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }
function hash2(x,z){ const h=Math.sin(x*127.1+z*311.7+0.37)*43758.5453; return h-Math.floor(h); }
function vnoise(x,z){ const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  const a=hash2(xi,zi),b=hash2(xi+1,zi),c=hash2(xi,zi+1),d=hash2(xi+1,zi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,z,oct=4){ let s=0,a=0.5,f=1,n=0; for(let i=0;i<oct;i++){ s+=a*vnoise(x*f+i*17.3,z*f-i*9.1); n+=a; a*=0.5; f*=2; } return s/n; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sm=x=>x*x*(3-2*x);
const smooth=(a,b,x)=>sm(clamp((x-a)/(b-a),0,1));
function cyc(t,P,off,up,hold,down){ const p=(((t+off)%P)+P)%P/P; if(p<up) return sm(p/up); if(p<up+hold) return 1; if(p<up+hold+down) return 1-sm((p-up-hold)/down); return 0; }

/* ============================== scene ============================== */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x000000);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,5000);
const OVERVIEW={pos:new THREE.Vector3(175,255,345), tgt:new THREE.Vector3(0,12,-5)};
camera.position.copy(OVERVIEW.pos);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.target.copy(OVERVIEW.tgt);
controls.minDistance=10; controls.maxDistance=1600; controls.maxPolarAngle=Math.PI;

const sun=new THREE.DirectionalLight(0xffffff,2.5); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-180,right:180,top:180,bottom:-180,near:60,far:950}); sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias=-0.0005; sun.shadow.normalBias=0.6; scene.add(sun); scene.add(sun.target);
const amb=new THREE.AmbientLight(0xbfc8d8,0.5); scene.add(amb);
const hemi=new THREE.HemisphereLight(0xdde8ff,0x3a2a1a,0.4); scene.add(hemi);
const sunMesh=new THREE.Mesh(new THREE.BoxGeometry(20,20,20),new THREE.MeshBasicMaterial({color:0xffe680})); scene.add(sunMesh);

/* ============================== world definition ============================== */
const GX0=-120,GX1=120,GZ0=-126,GZ1=126, GW=GX1-GX0+1, GD=GZ1-GZ0+1, N=GW*GD;
const idx=(x,z)=>(x-GX0)+(z-GZ0)*GW, inG=(x,z)=>x>=GX0&&x<=GX1&&z>=GZ0&&z<=GZ1;
const cellX=i=>(i%GW)+GX0, cellZ=i=>Math.floor(i/GW)+GZ0;
const inside=new Uint8Array(N), biome=new Uint8Array(N), type=new Uint8Array(N), occ=new Uint8Array(N), lavaC=new Uint8Array(N);
const ground=new Float32Array(N), water=new Float32Array(N).fill(-999), bottom=new Float32Array(N), edgeC=new Float32Array(N), owid=new Float32Array(N), blendA=new Float32Array(N), wcol=new Float32Array(N*3);

const BIO=[null,
 {name:'Snow Mountains',       cx:0,  cz:-98, sx:2.6, sz:1.0,  col:0xeef3ff, wx:'blizzard (far face)'},
 {name:'Snowy Conifer Forest', cx:-14,cz:-60, sx:1.9, sz:0.75, col:0x2f6b3a, wx:'snowfall'},
 {name:'Highlands',            cx:60, cz:-50, sx:1.15,sz:1.15, col:0x8ea67a, wx:'mist · light rain'},
 {name:'Jungle',               cx:-12,cz:-26, sx:1.6, sz:1.05, col:0x1f8a45, wx:'heavy rain · mist'},
 {name:'Swamp',                cx:-76,cz:-30, sx:1.0, sz:1.1,  col:0x5e6a2e, wx:'stagnant mist'},
 {name:'Grasslands',           cx:0,  cz:28,  sx:1.65,sz:1.3,  col:0x6fbf3f, wx:'passing showers'},
 {name:'Flowering Grove',      cx:66, cz:-10, sx:1.1, sz:1.0,  col:0xf08ac0, wx:'light rain'},
 {name:'Desert',               cx:74, cz:44,  sx:1.4, sz:1.55, col:0xe3c46e, wx:'sandstorm'},
 {name:'Volcano',              cx:-60,cz:38,  sx:1.1, sz:1.2,  col:0xff6a1a, wx:'eruptions · ash'},
];
const PEAKS=[{x:-48,z:-92,h:70,s:1.5},{x:-16,z:-98,h:82,s:1.45},{x:18,z:-94,h:78,s:1.5},{x:50,z:-90,h:66,s:1.5},{x:-72,z:-76,h:56,s:1.6}];
const MESAS=[{x:76,z:28,h:42,s:1.5,cap:38},{x:60,z:44,h:34,s:1.6,cap:99},{x:58,z:68,h:30,s:1.4,cap:26},{x:76,z:56,h:26,s:1.5,cap:99}];
const VOL={x:-60,z:38,h:54,s:1.8,rim:4,lavaLevel:44};
const ISLES=[{x:-80,z:60,r:4},{x:-30,z:96,r:5},{x:40,z:92,r:3.5},{x:-96,z:-8,r:3.5},{x:66,z:78,r:3}];
const JPONDS=[{x:-30,z:-40,r:4},{x:8,z:-34,r:3.5},{x:-40,z:-12,r:3}];
const T={GRASS:1,OLIVE:2,JUNGLE:3,GROVE:4,HIGH:5,HROCK:6,ROCK:7,SNOW:8,SNOWG:9,DESERT:10,SANDST:11,WASH:12,BASALT:13,ASH:14,OBSID:15,SAND:16,DSAND:17,SEABED:18,RIVERBED:19,SWAMP:20,MUD:21,DEEPBED:22,JROCK:23};

function biomeHeight(b,x,z,n1,n2){
  switch(b){
    case 1:{ let h=40+10*n1; for(const p of PEAKS){ const d=Math.hypot(x-p.x,z-p.z); h=Math.max(h,p.h-d*p.s+6*n2-3); } return h; }
    case 2: return 34+4*n1;
    case 3: return 18+16*clamp((-z-24)/36,0,1)+7*n2*n2+2*n1;
    case 4:{ let h=16+5*n1+3*n2; if(z+6*(n1-0.5)<-24) h+=7; return h; }
    case 5: return 10.6+1.2*n1;
    case 6: return 12+1.6*n1;
    case 7: return 14+2.2*n1;
    case 8:{ let h=12+3*n1; for(const m of MESAS){ const d=Math.hypot(x-m.x,z-m.z); h=Math.max(h,Math.min(m.cap,m.h-d*m.s+3*n2)); } return h; }
    case 9: return 14+2.5*n1;
  } return 12;
}

const SHALLOW=new THREE.Color(0x46d9cf), DEEP=new THREE.Color(0x173f8f), MIX=new THREE.Color(0x63e2c4), RIVER=new THREE.Color(0x4fd8f0), MURKY=new THREE.Color(0x556b3a), POOL=new THREE.Color(0x4a5a35);
const tmpA=new THREE.Color();
function setW(i,c){ wcol[i*3]=c.r; wcol[i*3+1]=c.g; wcol[i*3+2]=c.b; }

/* ---- pass 1: footprint, coast, biome, height, type ---- */
for(let z=GZ0; z<=GZ1; z++) for(let x=GX0; x<=GX1; x++){
  const i=idx(x,z);
  const rn=Math.hypot(x/106,z/112)+0.16*(fbm(x*0.028+31,z*0.028+7)-0.5);
  if(rn>=1) continue;
  inside[i]=1;
  const ec=(1-rn)*105; edgeC[i]=ec;
  bottom[i]=-(14+42*Math.pow(clamp(1-rn,0,1),0.6)+5*fbm(x*0.1,z*0.1,3));
  const a=Math.atan2(z,x), sa=Math.sin(a), ca=Math.cos(a);
  let bl=Math.max(Math.max(0,sa),Math.max(0,-ca),Math.max(0,ca)*0.6*smooth(-0.05,0.35,sa));
  bl=Math.pow(bl,1.3)*smooth(-0.75,-0.25,sa); blendA[i]=bl;
  const ow=bl<0.02?0:2+15*bl+12*(fbm(x*0.05+9,z*0.05+3)-0.5)*bl; owid[i]=ow;
  const wx=x+16*(fbm(x*0.04+5,z*0.04+11)-0.5), wz=z+16*(fbm(x*0.04-7,z*0.04+23)-0.5);
  let b1=0,d1=1e9,b2=0,d2=1e9;
  for(let b=1;b<=9;b++){ const B=BIO[b]; const d=Math.hypot((wx-B.cx)/B.sx,(wz-B.cz)/B.sz); if(d<d1){b2=b1;d2=d1;b1=b;d1=d;} else if(d<d2){b2=b;d2=d;} }
  biome[i]=b1;
  const n1=fbm(x*0.06,z*0.06), n2=fbm(x*0.13+40,z*0.13-20,3);
  const hA=biomeHeight(b1,x,z,n1,n2), hB=biomeHeight(b2,x,z,n1,n2);
  let bw=5; if((b1===3&&b2===7)||(b1===7&&b2===3)) bw=14; else if(b1===1||b2===1) bw=8;
  let h=lerp(hB,hA,0.5+0.5*smooth(0,bw,d2-d1));
  let isl=null, isld=0;
  for(const s of ISLES){ const d=Math.hypot(x-s.x,z-s.z); if(d<s.r+0.5+1.5*(n2-0.5)){ isl=s; isld=d; break; } }
  const ocean=bl>0.02&&ec<ow&&!isl;
  if(bl>0.02){ const cf=clamp((ec-ow)/12,0,1), cs=sm(cf); h=lerp(h,lerp(9.5+1.5*n2,h,cs*cs),smooth(0.05,0.3,bl)); }
  // volcano cone
  const dv=Math.hypot(x-VOL.x,z-VOL.z); const rimH=VOL.h-VOL.rim*VOL.s; let volType=false;
  if(dv<VOL.rim){ h=rimH-3-(VOL.rim-dv)*1.5; volType=true; }
  else { const cone=VOL.h-dv*VOL.s+2.5*n2-1; if(cone>h&&!ocean){ h=cone; volType=true; } }
  if(ocean){
    const df=clamp((ow-ec)/Math.max(ow,1),0,1);
    let sb=7.4-4.6*Math.pow(df,1.1)+0.8*(n2-0.5);
    for(const s of ISLES){ if(Math.hypot(x-s.x,z-s.z)<s.r+7) sb=Math.max(sb,6.6+0.4*n2); }
    if(ec<2.3 && fbm(x*0.14+2,z*0.14+5,3)<=0.56){ ground[i]=9; type[i]=T.ROCK; continue; }       // rocky rim lip
    if(ow-ec<3 && n2>0.84){ ground[i]=9+Math.round(n1); type[i]=T.ROCK; continue; }             // shoreline rocks
    ground[i]=Math.round(sb); water[i]=8; type[i]=sb>5.5?T.SEABED:T.DEEPBED;
    tmpA.copy(SHALLOW).lerp(DEEP,Math.pow(df,0.8)); setW(i,tmpA);
    continue;
  }
  let t;
  if(isl){ h=9+clamp((isl.r-isld)*0.6,0,3); t=n2>0.62?T.ROCK:T.SAND; }
  else if(volType||b1===9){ t=(dv<11||n1>0.58)?T.ASH:T.BASALT; }
  else switch(b1){
    case 1: t=h>56?T.SNOW:(h>48&&n2>0.4?T.SNOW:T.ROCK); break;
    case 2: t=T.SNOWG; break;
    case 3: t=n2>0.7?T.HROCK:T.HIGH; break;
    case 4: t=fbm(x*0.1+77,z*0.1,3)>0.68?T.JROCK:T.JUNGLE; break;
    case 5: t=T.SWAMP; break;
    case 6: t=n1>0.6?T.OLIVE:T.GRASS; break;
    case 7: t=T.GROVE; break;
    case 8: t=h>16.5?T.SANDST:T.DESERT; break;
  }
  if(!isl && bl>0.1 && ec-ow<3.5+2*n2){
    if(volType) {}
    else if(b1===9) t=T.DSAND;
    else if(b1===5) t=T.MUD;
    else { t=T.SAND; if(fbm(x*0.09+3,z*0.09,3)>0.7){ t=T.ROCK; h+=2; } }
  }
  ground[i]=Math.round(h); type[i]=t;
  if(dv<VOL.rim){ water[i]=VOL.lavaLevel; lavaC[i]=1; }
}

/* ---- helpers for hydrology stamping ---- */
function topAt(cx,cz){ if(!inG(cx,cz)) return 8; const i=idx(cx,cz); if(!inside[i]) return 8; return water[i]>-999?water[i]:ground[i]; }
function isOcean(i){ return water[i]===8 && (type[i]===T.SEABED||type[i]===T.DEEPBED); }
function stampPool(cx,cz,r,color){
  let lvl=1e9; for(let z=Math.floor(cz-r);z<=Math.ceil(cz+r);z++) for(let x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++){ if(!inG(x,z)) continue; const i=idx(x,z); if(inside[i]&&Math.hypot(x-cx,z-cz)<=r) lvl=Math.min(lvl,ground[i]); }
  lvl-=1;
  for(let z=Math.floor(cz-r-2);z<=Math.ceil(cz+r+2);z++) for(let x=Math.floor(cx-r-2);x<=Math.ceil(cx+r+2);x++){
    if(!inG(x,z)) continue; const i=idx(x,z); if(!inside[i]||isOcean(i)||lavaC[i]) continue; const d=Math.hypot(x-cx,z-cz);
    if(d<=r){ water[i]=lvl; ground[i]=Math.min(ground[i],lvl-2); type[i]=T.RIVERBED; setW(i,color); }
    else if(d<=r+1.5 && water[i]<=-999) ground[i]=Math.max(ground[i],lvl);
  }
}
// swamp pools & jungle ponds
for(let i=0;i<N;i++){ if(!inside[i]||biome[i]!==5||water[i]>-999||type[i]===T.SAND) continue; const x=cellX(i),z=cellZ(i);
  if(fbm(x*0.09+50,z*0.09+50,3)>0.57){ water[i]=ground[i]; ground[i]-=1; type[i]=T.MUD; setW(i,POOL); } }
for(const p of JPONDS) stampPool(p.x,p.z,p.r,RIVER);

const RIVERS=[
 {k:'river',w:2.2,w1:3.4,p:[[6,-84],[3,-74],[-3,-64],[-7,-54],[-13,-44],[-21,-34],[-27,-24],[-22,-14],[-12,-6],[-5,4],[1,14],[0,26],[-3,36],[0,46],[2,56],[4,66],[5,80],[4,94],[3,106]]},
 {k:'river',w:1.9,w1:2.4,p:[[0,42],[-8,49],[-14,57],[-18,66],[-22,78],[-27,90],[-31,102]]},
 {k:'river',w:1.8,w1:2.4,p:[[1,48],[9,53],[14,60],[17,70],[21,82],[25,92],[28,102]]},
 {k:'river',w:1.2,w1:1.6,p:[[-20,70],[-12,80],[-8,92],[-6,104]]},
 {k:'river',w:1.5,w1:1.8,p:[[66,-62],[58,-48],[48,-36],[36,-27],[22,-19],[8,-10],[-6,-3]]},
 {k:'river',w:1.3,w1:1.6,p:[[74,-30],[68,-18],[60,-8],[50,2],[38,10],[24,18],[10,24],[1,26]]},
 {k:'river',w:1.1,w1:1.3,p:[[86,-22],[78,-12],[70,-4],[61,-7]]},
 {k:'river',w:1.3,w1:1.6,p:[[-40,8],[-30,16],[-18,22],[-6,26],[0,27]]},
 {k:'river',w:1.2,w1:1.5,p:[[32,30],[20,36],[8,40],[0,42]]},
 {k:'river',w:1.1,w1:1.4,p:[[-32,40],[-20,46],[-10,50]]},
 {k:'swamp',w:1.6,w1:2.0,p:[[-24,-30],[-36,-33],[-48,-31],[-60,-28],[-70,-26]]},
 {k:'wash',w:1.6,p:[[80,18],[75,30],[70,42],[68,52]]},
 {k:'wash',w:1.4,p:[[92,44],[86,56],[80,66],[76,74]]},
 {k:'wash',w:1.2,p:[[52,50],[56,62],[58,72]]},
 {k:'lava',w:1.2,p:[[-60,38],[-64,45],[-70,50],[-76,56],[-84,62]],pool:{x:-74,z:53,r:3}},
 {k:'lava',w:1.2,p:[[-60,38],[-54,44],[-47,50],[-43,54]],pool:{x:-42,z:55,r:4}},
 {k:'lava',w:1.0,p:[[-60,38],[-62,29],[-64,20]],pool:{x:-65,z:17,r:3}},
];
function samplePath(pts,wiggle){
  const out=[]; let s=0;
  for(let k=0;k<pts.length-1;k++){ const [ax,az]=pts[k],[bx,bz]=pts[k+1]; const L=Math.hypot(bx-ax,bz-az); const nx=-(bz-az)/L, nz=(bx-ax)/L;
    for(let d=0; d<L; d+=0.5){ const t=d/L; const o=wiggle?(2.2*Math.sin(s*0.35)+1.2*Math.sin(s*0.9+1)):0; out.push([lerp(ax,bx,t)+nx*o, lerp(az,bz,t)+nz*o]); s+=0.5; } }
  out.push(pts[pts.length-1].slice()); return out;
}
const mouths=[];
for(const R of RIVERS){
  const S=samplePath(R.p, R.k==='river'||R.k==='swamp'); const n=S.length;
  if(R.k==='wash'){
    const done=new Set();
    S.forEach((p,k)=>{ const w=R.w*(1-k/(n-1)); if(w<0.3) return; for(let z=Math.floor(p[1]-w);z<=Math.ceil(p[1]+w);z++) for(let x=Math.floor(p[0]-w);x<=Math.ceil(p[0]+w);x++){ if(!inG(x,z)) continue; const i=idx(x,z); if(!inside[i]||water[i]>-999||done.has(i)||Math.hypot(x-p[0],z-p[1])>w) continue; done.add(i); ground[i]-=1; type[i]=T.WASH; } });
    continue;
  }
  if(R.k==='lava'){
    const lv=new Float32Array(n); lv[0]=VOL.lavaLevel;
    for(let k=1;k<n;k++){ const cx=Math.round(S[k][0]),cz=Math.round(S[k][1]); lv[k]=Math.min(lv[k-1],topAt(cx,cz)); }
    S.forEach((p,k)=>{ const w=R.w, L=lv[k]; for(let z=Math.floor(p[1]-w-1.5);z<=Math.ceil(p[1]+w+1.5);z++) for(let x=Math.floor(p[0]-w-1.5);x<=Math.ceil(p[0]+w+1.5);x++){ if(!inG(x,z)) continue; const i=idx(x,z); if(!inside[i]||isOcean(i)) continue; const d=Math.hypot(x-p[0],z-p[1]);
      if(d<=w){ if(water[i]>-999&&!lavaC[i]) continue; water[i]=lavaC[i]?Math.min(water[i],L):L; lavaC[i]=1; ground[i]=Math.min(ground[i],L-1); type[i]=T.BASALT; }
      else if(d<=w+1.5&&water[i]<=-999) ground[i]=Math.max(ground[i],L); } });
    if(R.pool){ const {x:cx,z:cz,r}=R.pool; let lvl=1e9;
      for(let z=Math.floor(cz-r);z<=Math.ceil(cz+r);z++) for(let x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++){ if(!inG(x,z)) continue; const i=idx(x,z); if(inside[i]&&!isOcean(i)&&Math.hypot(x-cx,z-cz)<=r) lvl=Math.min(lvl,water[i]>-999?water[i]:ground[i]); }

  for(const a of animals){
    if(a.wait>0) a.wait-=dt; else { const dx=a.tx-a.x, dz=a.tz-a.z, d=Math.hypot(dx,dz);
      if(d<0.4){ a.wait=1+Math.random()*4; pickTarget(a); } else { const s=Math.min(a.speed*dt,d); a.x+=dx/d*s; a.z+=dz/d*s; const want=Math.atan2(-dz,dx); let da=want-a.ang; da=Math.atan2(Math.sin(da),Math.cos(da)); a.ang+=da*Math.min(1,dt*6); a.ph+=dt*10;
        for(let k=0;k<a.legs.length;k++) a.legs[k].rotation.z=Math.sin(a.ph+(k%2)*Math.PI)*0.5; } }
    const yb=heightAt(a.x,a.z); if(yb>-900) a.g.position.set(a.x,yb+a.yoff+(a.water?Math.sin(time*2+a.ph)*0.1:0),a.z); a.g.rotation.y=a.ang;
  }
  // camera flight
  if(fly){ fly.s+=dt/1.8; const k=sm(clamp(fly.s,0,1)); camera.position.lerpVectors(fly.p0,fly.p1,k); controls.target.lerpVectors(fly.t0,fly.t1,k); if(fly.s>=1) fly=null; }
  controls.update();
  // HUD
  hudT+=dt; if(hudT>0.25){ hudT=0; seasonEl.textContent=season.name; const day=Math.floor(time/DAY)+1; const tl=df<0.05?'Dawn':df<0.18?'Morning':df<0.32?'Noon':df<0.45?'Afternoon':df<0.55?'Dusk':'Night'; timeEl.textContent=`${tl} · Day ${day}`; }
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
animate();
</script>

</html>
