<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ───────────── utilities ───────────── */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=mulberry32(20240607);
const hash=(x,y,s=0)=>{let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296};
function vnoise(x,y,s=0){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s=0,o=4){let a=.5,f=1,sum=0,n=0;for(let i=0;i<o;i++){sum+=a*vnoise(x*f,y*f,s+i*17);n+=a;a*=.5;f*=2}return sum/n}
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(rand()*a.length)];

/* ───────────── renderer / scene ───────────── */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.5,1200);
camera.position.set(0,100,118);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,4,2);controls.enableDamping=true;controls.dampingFactor=.08;
controls.maxDistance=330;controls.minDistance=6;controls.screenSpacePanning=true;
controls.update();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

/* lights */
const hemi=new THREE.HemisphereLight(0xbfd8ff,0x6a5a4a,.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d0,1.05);
sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-78,right:78,top:78,bottom:-78,near:10,far:500});
sun.shadow.bias=-.0006;sun.shadow.normalBias=.35;
scene.add(sun,sun.target);
const moon=new THREE.DirectionalLight(0x7f98ff,0);moon.position.set(-60,90,-50);scene.add(moon);
const sunMesh=new THREE.Mesh(new THREE.BoxGeometry(11,11,2),new THREE.MeshBasicMaterial({color:0xfff0a0}));scene.add(sunMesh);
const lavaLight=new THREE.PointLight(0xff5a1a,2,50,1.4);scene.add(lavaLight);

/* ───────────── instancing helper ───────────── */
const BOX=new THREE.BoxGeometry(1,1,1);
const PLANE=new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2);
const _m=new THREE.Matrix4(),_c=new THREE.Color();
class Inst{
  constructor(mat,cap,o={}){this.mesh=new THREE.InstancedMesh(o.geo||BOX,mat,cap);this.n=0;this.cap=cap;this.mesh.frustumCulled=false;
    this.mesh.castShadow=!!o.cast;this.mesh.receiveShadow=!!o.recv;}
  add(x,y,z,sx,sy,sz,col){if(this.n>=this.cap)return -1;_m.set(sx,0,0,x,0,sy,0,y,0,0,sz,z,0,0,0,1);this.mesh.setMatrixAt(this.n,_m);
    if(col!==undefined){if(col.isColor)this.mesh.setColorAt(this.n,col);else{_c.set(col);this.mesh.setColorAt(this.n,_c)}}return this.n++}
  done(){this.mesh.count=this.n;this.mesh.instanceMatrix.needsUpdate=true;if(this.mesh.instanceColor)this.mesh.instanceColor.needsUpdate=true;scene.add(this.mesh);return this}
}
const col=(hex,a=.08)=>{const c=new THREE.Color(hex);return c.multiplyScalar(1+(rand()-.5)*2*a)};
const lam=()=>new THREE.MeshLambertMaterial({color:0xffffff});

/* ───────────── world grid ───────────── */
const N=120,HALF=60,SEA=1;
const idx=(i,j)=>j*N+i, cx=i=>i-HALF+.5, cellOf=x=>Math.floor(x+HALF), IN=(i,j)=>i>=0&&j>=0&&i<N&&j<N;
const B={MT:1,SF:2,HL:3,JG:4,SW:5,GR:6,GV:7,DS:8,VC:9};
const NN=N*N;
const inside=new Uint8Array(NN),biome=new Uint8Array(NN),Hf=new Float32Array(NN),H=new Int16Array(NN),Ls=new Int16Array(NN).fill(-999),
  wk=new Uint8Array(NN),lava=new Uint8Array(NN),obs=new Uint8Array(NN),cfA=new Float32Array(NN),eA=new Float32Array(NN),qA=new Float32Array(NN),
  RmA=new Float32Array(NN),occ=new Uint8Array(NN),rockA=new Uint8Array(NN),sandA=new Uint8Array(NN),washA=new Float32Array(NN),nearR=new Uint8Array(NN),
  nearLava=new Uint8Array(NN),mixA=new Float32Array(NN);
const VX=-22,VZ=26;
const Rim=th=>52+3*Math.sin(3*th+1.3)+2*Math.sin(5*th+.4)+3*(vnoise(Math.cos(th)*2+10,Math.sin(th)*2+10,3)-.5);

function biomeAt(x,z){
  const wx=x+10*(fbm(x*.05,z*.05,3)-.5),wz=z+10*(fbm(x*.05+40,z*.05+40,4)-.5);
  if(Math.hypot(x-VX,z-VZ)+3*(fbm(x*.15,z*.15,8)-.5)<15)return B.VC;
  if(wz<-33)return B.MT;
  if(wz<-10&&wx<-8)return B.HL;
  if(wz<-14)return B.SF;
  if(wx<-12)return wz<8?B.GV:B.GR;
  if(wx>=16&&wz>=10)return B.DS;
  if(wz>=10)return B.GR;
  return wx>32?B.SW:B.JG;
}
function baseH(b,x,z,c){
  const n1=(fbm(x*.09,z*.09,1)-.5)*2,n2=(fbm(x*.2,z*.2,2)-.5)*2;
  const wx=x,wz=z;
  switch(b){
    case B.MT:{const ridge=clamp(1-Math.abs(2*fbm(x*.05,z*.05,7,5)-1)*2.4,0,1);const amp=clamp(.45+1.1*(fbm(x*.035,z*.035,8,3)-.3),.3,1.2);
      const mt=ss(0,1,(-wz-32)/9),rear=1-.3*ss(-46,-56,wz);return Math.min(47,14+mt*(4+28*Math.pow(ridge,1.6)*amp)*rear+n2*.8)}
    case B.SF:return 14+1.3*n1+.7*n2;
    case B.HL:return 13-.4*clamp(wz+24,0,30)+2.2*n1+2.5*ss(.55,.75,fbm(x*.1,z*.1,5));
    case B.GV:return 3.7+.9*n1;
    case B.JG:return 8-.12*(wz+14)+2.2*n1-4*ss(24,34,wx);
    case B.SW:return fbm(x*.14,z*.14,13)>.56?0:2.3+.7*n1;
    case B.GR:return 4.3+.7*n1+.4*n2;
    case B.DS:return 3.2+2*(fbm(x*.07,z*.07,15)-.5)*2*.6+.3*n2;
    case B.VC:{const d=Math.hypot(x-VX,z-VZ);if(d<2.4)return 24;if(d<3.6)return 30+n2*.4;
      return d<15?3+31*Math.pow(1-d/15,1.1)+.5*n2:3.3}
  }return 2;
}
for(let j=0;j<N;j++)for(let i=0;i<N;i++){
  const x=cx(i),z=cx(j),c=idx(i,j),r=Math.hypot(x,z),Rm=Rim(Math.atan2(z,x));
  if(r>=Rm)continue;
  inside[c]=1;qA[c]=r/Rm;eA[c]=Rm-r;RmA[c]=Rm;
  const b=biomeAt(x,z);biome[c]=b;Hf[c]=baseH(b,x,z,c);
}
// smoothing
for(let k=0;k<3;k++){const t=Float32Array.from(Hf);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const c=idx(i,j);if(!inside[c]||biome[c]===B.VC)continue;
    let s=Hf[c]*2,w=2;for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){if(!di&&!dj)continue;const ii=i+di,jj=j+dj;if(IN(ii,jj)&&inside[idx(ii,jj)]){s+=Hf[idx(ii,jj)];w++}}
    t[c]=s/w}
  Hf.set(t)}
// desert sandstone mountains
const DCONES=[[34,26,16,11],[22,32,11,8],[44,20,13,8]];
// coast, beaches, headlands, islets
for(let j=0;j<N;j++)for(let i=0;i<N;i++){
  const c=idx(i,j);if(!inside[c])continue;const x=cx(i),z=cx(j),b=biome[c],r=Math.hypot(x,z);
  if(b===B.DS)for(const[cxx,czz,h,rad]of DCONES){const d=Math.hypot(x-cxx,z-czz);const v=h*Math.max(0,1-d/rad);if(v>0)Hf[c]+=Math.round(v/2)*2}
  const v=(-x+z)/(1.414*Math.max(r,1));
  const cf=clamp((v+.1)*1.8,0,1)*ss(-12,0,z);cfA[c]=cf;
  const e2=eA[c]+3.5*(fbm(x*.09,z*.09,19)-.5)*2;eA[c]=e2;
  if(cf>0){
    let k=cf*(1-ss(12,26,e2));
    if(b===B.VC)k*=ss(8,13,Math.hypot(x-VX,z-VZ));
    if(k>0){const target=lerp(-5,2.6,clamp(e2/14,0,1));
      const head=ss(.66,.78,fbm(x*.11,z*.11,9))*cf*ss(0,4,e2)*(1-ss(16,24,e2));
      Hf[c]=lerp(Hf[c],target,k);
      if(head>.3&&b!==B.VC){Hf[c]+=head*5;rockA[c]=1}
      if(Hf[c]<.6&&e2>3&&e2<13&&cf>.4){const n=fbm(x*.16,z*.16,11);if(n>.66){Hf[c]=Math.max(Hf[c],1+(n-.66)*40);rockA[c]=2}else if(n>.6){Hf[c]=Math.max(Hf[c],-.6);rockA[c]=3}}
    }
  }
}
for(let c=0;c<NN;c++){if(!inside[c])continue;H[c]=Math.max(-6,Math.round(Hf[c]));if(H[c]<=0){Ls[c]=SEA;wk[c]=biome[c]===B.SW?3:1}}

/* ───────────── hydrology ───────────── */
function mkPath(ctrl,amp=2,seed=0){
  const pts=[];
  for(let k=0;k<ctrl.length-1;k++){const[x0,z0]=ctrl[k],[x1,z1]=ctrl[k+1];const L=Math.hypot(x1-x0,z1-z0),n=Math.max(1,Math.ceil(L/.8));for(let s=0;s<n;s++)pts.push([x0+(x1-x0)*s/n,z0+(z1-z0)*s/n])}
  pts.push([...ctrl[ctrl.length-1]]);
  const n=pts.length,out=[];
  for(let i=0;i<n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];let dx=b[0]-a[0],dz=b[1]-a[1];const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
    const env=Math.min(1,i/10,(n-1-i)/10);const off=((fbm(i*.045,seed*13.7,seed+50,3)-.5)*2*amp*3+amp*.5*Math.sin(i*.12+seed))*env;
    out.push([pts[i][0]-dz*off,pts[i][1]+dx*off])}
  return out;
}
const rivers=[];const falls=[];
function carve(pts,o){
  const n=pts.length;
  const hs=pts.map(p=>{let s=0,k=0;const i0=cellOf(p[0]),j0=cellOf(p[1]);for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const ii=i0+a,jj=j0+b;if(IN(ii,jj)&&inside[idx(ii,jj)]){s+=H[idx(ii,jj)];k++}}return k?s/k:1});
  const win=o.win||3;const sm=hs.map((_,i)=>{let s=0,k=0;for(let a=-win;a<=win;a++){const q=i+a;if(q>=0&&q<n){s+=hs[q];k++}}return s/k});
  const lev=[];let prev=999;
  for(let i=0;i<n;i++){let L=o.fixed!=null?o.fixed:Math.round(sm[i])-1;L=Math.max(1,L);prev=Math.min(prev,L);lev.push(prev)}
  for(let i=0;i<n;i++){const[x,z]=pts[i];const w=lerp(o.w0,o.w1,i/(n-1)),rr=w/2,L=lev[i];const i0=cellOf(x),j0=cellOf(z),R=Math.ceil(rr+1.6);
    for(let a=-R;a<=R;a++)for(let b=-R;b<=R;b++){const ii=i0+a,jj=j0+b;if(!IN(ii,jj))continue;const c=idx(ii,jj);if(!inside[c])continue;
      const d=Math.hypot(cx(ii)-x,cx(jj)-z);
      if(d<=rr){if(wk[c]===1)continue;if(Ls[c]===-999||L<Ls[c]){Ls[c]=L;H[c]=L-1;wk[c]=o.kind}}
      else if(d<=rr+1.5&&Ls[c]===-999){if(H[c]<L)H[c]=L}}}
  rivers.push({pts,lev,kind:o.kind,w:o.w1});
  if(o.kind===2&&!o.nofall){let used=-99;const cand=[];
    for(let i=0;i+5<n;i++)cand.push([lev[i]-lev[i+5],i]);cand.sort((a,b)=>b[0]-a[0]);
    let cnt=0;for(const[dr,i]of cand){if(dr<3||cnt>=(o.falls||2))break;if(Math.abs(i-used)<14)continue;used=i;cnt++;
      falls.push({x:(pts[i][0]+pts[i+5][0])/2,z:(pts[i][1]+pts[i+5][1])/2,top:lev[i]+.5,bot:lev[i+5]+.5,w:Math.max(1.6,o.w1),big:dr>=5})}}
}
function carveDisc(x,z,rad,kind){
  const i0=cellOf(x),j0=cellOf(z);let s=0,k=0;
  for(let a=-Math.ceil(rad);a<=Math.ceil(rad);a++)for(let b=-Math.ceil(rad);b<=Math.ceil(rad);b++){const ii=i0+a,jj=j0+b;if(IN(ii,jj)&&inside[idx(ii,jj)]&&Math.hypot(a,b)<=rad){s+=H[idx(ii,jj)];k++}}
  if(!k)return;const L=Math.max(2,Math.round(s/k)-1);
  for(let a=-Math.ceil(rad+2);a<=Math.ceil(rad+2);a++)for(let b=-Math.ceil(rad+2);b<=Math.ceil(rad+2);b++){const ii=i0+a,jj=j0+b;if(!IN(ii,jj))continue;const c=idx(ii,jj);if(!inside[c])continue;
    const d=Math.hypot(cx(ii)-x,cx(jj)-z);
    if(d<=rad){if(Ls[c]===-999){Ls[c]=L;H[c]=L-1;wk[c]=kind}}else if(d<=rad+1.6&&Ls[c]===-999&&H[c]<L)H[c]=L}
}
const mainCtrl=[[2,-42],[4,-34],[3,-26],[7,-18],[10,-13],[12,-6],[15,0],[10,5],[6,9],[3,14],[-2,20],[-1,27],[2,33],[1,39]];
const mainPath=mkPath(mainCtrl,2,1);
// tributaries and melt streams first, main after (so main wins junctions)
carve(mkPath([[-26,-38],[-26,-28],[-22,-18],[-24,-10],[-27,-2],[-27,1],[-24,8],[-18,15],[-8,20],[-2,21]],1.8,2),{w0:1.3,w1:2.2,kind:2,falls:2});
carve(mkPath([[18,-42],[18,-32],[20,-22],[24,-14],[23,-6],[22,-2],[18,4],[12,10],[8,15],[3,17]],1.8,3),{w0:1.4,w1:2.4,kind:2,win:2,falls:3});
carve(mkPath([[-36,-8],[-33,-2],[-30,4],[-26,8]],1.2,4),{w0:1.1,w1:1.5,kind:2,nofall:1});
carve(mkPath([[-20,-6],[-18,2],[-16,8]],1.2,5),{w0:1.1,w1:1.5,kind:2,nofall:1});
// swamp stagnant channels
carve(mkPath([[22,-2],[28,-3],[34,-1],[40,0],[46,-3]],1.5,6),{w0:1.6,w1:2.4,kind:3});
carve(mkPath([[36,-9],[38,-3],[41,4],[40,9]],1.5,7),{w0:1.4,w1:2,kind:3});
// grassland tributary network
{const cellsG=[];for(let c=0;c<NN;c++)if(inside[c]&&biome[c]===B.GR&&eA[c]>16&&Ls[c]===-999)cellsG.push(c);
  for(let k=0;k<8&&cellsG.length;k++){const c=pick(cellsG),sx=cx(c%N),sz=cx(Math.floor(c/N));
    let best=null,bd=1e9;for(const p of mainPath){const d=Math.hypot(p[0]-sx,p[1]-sz);if(d<bd&&p[1]>12){bd=d;best=p}}
    if(!best||bd<5||bd>26)continue;
    const mx=(sx+best[0])/2+(rand()-.5)*6,mz=(sz+best[1])/2+(rand()-.5)*6;
    carve(mkPath([[sx,sz],[mx,mz],[best[0],best[1]]],1.3,10+k),{w0:1,w1:1.6,kind:2,nofall:1})}}
carve(mainPath,{w0:2.2,w1:3.6,kind:2,falls:3,win:3});
// coastal delta (braided)
const deltaCh=[[[1,39],[-3,44],[-9,50]],[[1,39],[1,46],[1,54]],[[1,39],[5,44],[10,50]],[[-3,44],[0,48]],[[5,44],[2,48]]];
deltaCh.forEach((ch,k)=>carve(mkPath(ch,.8,20+k),{w0:2.6,w1:3.2,kind:2,fixed:1,nofall:1}));
const mouths=[[-9,50],[1,54],[10,50]];
// ponds
carveDisc(-14,-24,2.6,2);carveDisc(-33,4,2.8,2);
{let placed=0,tries=0;while(placed<5&&tries<400){tries++;const c=pick(Array.from({length:1},()=>Math.floor(rand()*NN)));if(!inside[c]||biome[c]!==B.JG)continue;
  const x=cx(c%N),z=cx(Math.floor(c/N));let ok=true;
  for(let a=-6;a<=6&&ok;a++)for(let b=-6;b<=6;b++){const ii=c%N+a,jj=Math.floor(c/N)+b;if(IN(ii,jj)&&Ls[idx(ii,jj)]!==-999){ok=false;break}}
  if(ok){carveDisc(x,z,2.2+rand()*1.2,2);placed++}}}
// dry washes
const washes=[[[34,26],[29,31],[24,37],[19,43]],[[22,32],[26,38],[29,44]],[[44,20],[41,27],[38,34],[33,40]]];
washes.forEach((w,k)=>{const pts=mkPath(w,1.4,30+k),n=pts.length;
  pts.forEach((p,i)=>{const fade=1-i/(n-1),i0=cellOf(p[0]),j0=cellOf(p[1]);
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const ii=i0+a,jj=j0+b;if(!IN(ii,jj))continue;const c=idx(ii,jj);if(!inside[c]||Ls[c]!==-999)continue;
      if(Math.hypot(cx(ii)-p[0],cx(jj)-p[1])<=1.2*(.5+fade))washA[c]=Math.max(washA[c],fade)}})});
// lava tributaries & pools (volcanic ground)
const lavaPools=[];
[[-40,15],[20,14],[100,14],[150,17]].forEach(([deg,len],k)=>{
  const a=deg*Math.PI/180,x0=VX+Math.cos(a)*3.4,z0=VZ+Math.sin(a)*3.4,x1=VX+Math.cos(a)*len,z1=VZ+Math.sin(a)*len;
  const pts=mkPath([[x0,z0],[x1,z1]],1.2,40+k),n=pts.length;
  pts.forEach((p,i)=>{const rr=lerp(.9,1.5,i/(n-1)),i0=cellOf(p[0]),j0=cellOf(p[1]);
    for(let aa=-2;aa<=2;aa++)for(let bb=-2;bb<=2;bb++){const ii=i0+aa,jj=j0+bb;if(!IN(ii,jj))continue;const c=idx(ii,jj);if(!inside[c]||Ls[c]!==-999||lava[c])continue;
      if(Math.hypot(cx(ii)-p[0],cx(jj)-p[1])<=rr&&H[c]>2){lava[c]=1;H[c]-=1}}});
  if(k<2){const e=pts[n-1];lavaPools.push(e);const i0=cellOf(e[0]),j0=cellOf(e[1]);
    for(let aa=-3;aa<=3;aa++)for(let bb=-3;bb<=3;bb++){const ii=i0+aa,jj=j0+bb;if(!IN(ii,jj))continue;const c=idx(ii,jj);if(!inside[c]||Ls[c]!==-999)continue;
      if(Math.hypot(cx(ii)-e[0],cx(jj)-e[1])<=2.5&&!lava[c]){lava[c]=1;H[c]-=1}}}
});
for(let j=0;j<N;j++)for(let i=0;i<N;i++){const c=idx(i,j);if(!inside[c])continue;if(Math.hypot(cx(i)-VX,cx(j)-VZ)<2.4&&Ls[c]===-999)lava[c]=1}
// obsidian where lava meets water

  let wet=false;for(let dj=-2;dj<=2&&!wet;dj++)for(let di=-2;di<=2;di++){const ii=i+di,jj=j+dj;if(IN(ii,jj)&&inside[idx(ii,jj)]&&Ls[idx(ii,jj)]!==-999&&wk[idx(ii,jj)]!==3){wet=true;break}}
  if(wet){lava[c]=0;obs[c]=1;obsCells.push(c)}}
for(const c of obsCells){const i=c%N,j=Math.floor(c/N);for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const ii=i+di,jj=j+dj;if(!IN(ii,jj))continue;const n=idx(ii,jj);
  if(inside[n]&&biome[n]===B.VC&&!lava[n]&&Ls[n]===-999)obs[n]=1}}
for(let j=0;j<N;j++)for(let i=0;i<N;i++){const c=idx(i,j);if(!inside[c])continue;

// near-river mask & sand & freshwater mix
for(let j=0;j<N;j++)for(let i=0;i<N;i++){const c=idx(i,j);if(!inside[c])continue;
  if(wk[c]===2)for(let dj=-2;dj<=2;dj++)for(let di=-2;di<=2;di++){const ii=i+di,jj=j+dj;if(IN(ii,jj))nearR[idx(ii,jj)]=1}
  const b=biome[c];
  if(Ls[c]===-999&&cfA[c]>.2&&eA[c]<22&&H[c]<=4&&b!==B.VC&&b!==B.MT&&rockA[c]!==2&&rockA[c]!==1)sandA[c]=1;

const seasonal=[];const lavaItems=[];
const SOIL={1:0x5c6673,2:0x8a7a68,3:0x6b6a58,4:0x5a3f26,5:0x4a3f2a,6:0x6e4b2e,7:0x7a5a48,8:0xc79a4a,9:0x222226};

function capColor(c,x,z){

  if(nearLava[c]&&b===B.VC)return[col(pick([0x6a1410,0x8a1c14,0x3a0d0d]),.1),0];

    case B.SF:return[fbm(x*.13,z*.13,26)>.72?col(0x7d8794,.08):col(pick([0xeef4f8,0xe2ecf4,0xf6fafc]),.02),0];

    case B.SW:return[col(pick([0x6b7a3a,0x5b6a30,0x4f5a2a,0x4a3f2a]),.06),0];
    case B.GR:return fbm(x*.1,z*.1,22)>.6?[col(0x8a9a3e,.05),1]:[col(pick([0x6fb04a,0x7cbb52,0x63a344]),.04),1];
    case B.GV:return[col(pick([0xd39cb8,0xc7a0b0,0xb7c47c,0xd8a3bd]),.05),2];

    case B.VC:return[col(fbm(x*.15,z*.15,28)>.66?0x4a4a52:pick([0x1b1b20,0x25252b,0x2f2f36]),.06),0];
  }return[col(0x888888),0];
}
const capIdx=new Int32Array(NN).fill(-1);
for(let j=0;j<N;j++)for(let i=0;i<N;i++){
  const c=idx(i,j);if(!inside[c])continue;
  const x=cx(i),z=cx(j),h=H[c],q=qA[c],b=biome[c];
  const bottom=-(12+26*Math.pow(Math.max(0,1-q),1.3)+14*Math.max(0,vnoise(x*.2,z*.2,5)-.5)*(1-q*.6));

    if(wk[c]===1){bed=obsCells.length&&(()=>{for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const ii=i+di,jj=j+dj;if(IN(ii,jj)&&obs[idx(ii,jj)])return true}return false})()?col(0x1a0f2e,.05):
       rockA[c]===3?col(pick([0xff7a90,0xffb347,0xb45cff,0xff5fa0]),.08):
       col(d<=1?0xe8dcae:d===2?0xc9d0b0:d===3?0x3b7fb0:d===4?0x1f5a9a:0x143a78,.03).lerp(new THREE.Color(0xa8f0dc),mixA[c]*.6)}
    else if(wk[c]===3)bed=col(0x3b4526,.06);else bed=col(0x2fa8d8,.05);

const groundY=(x,z)=>{const i=cellOf(x),j=cellOf(z);if(!IN(i,j))return 0;const c=idx(i,j);if(!inside[c])return 0;return (Ls[c]!==-999?Ls[c]:H[c])+.5};

/* ───────────── props: trees, plants, etc ───────────── */
const matP=lam();
const P=new Inst(matP,70000,{cast:true,recv:true});
const propSeasonal=[];
const addS=(kind,x,y,z,sx,sy,sz,c)=>{const cc=c.isColor?c:new THREE.Color(c);const k=P.add(x,y,z,sx,sy,sz,cc);if(k>=0)propSeasonal.push({i:k,base:cc.clone(),kind})};
function pine(x,y,z,s){const th=2+rand()*1.5;P.add(x,y+th/2,z,.9,th,.9,col(0x5a3b1f,.1));
  for(let k=0;k<5;k++){const sz=(5-k)*s,yy=y+th+k*1+.5;P.add(x,yy,z,sz,1,sz,col(pick([0x1d4d2b,0x225a32,0x1a4527]),.06));P.add(x,yy+.6,z,Math.max(.5,sz-.7),.35,Math.max(.5,sz-.7),0xffffff)}}

  const w=big?8:5+rand()*2;P.add(x,y+th+.7,z,w,1.6,w,col(pick([0x148a48,0x1a9d55,0x0f7a3c,0x21b061]),.05));
  P.add(x+(rand()-.5),y+th+2.1,z+(rand()-.5),w*.7,1.4,w*.7,col(pick([0x1ec46a,0x22b862,0x17a34f]),.05));P.add(x,y+th+3.2,z,w*.4,1,w*.4,col(0x2bd070,.05));
  if(rand()<.4)P.add(x+w/2-.2,y+th-2,z,.25,4.5,.25,col(0x2d8a3c,.1))}
function pinkTree(x,y,z){const th=3+rand()*2;P.add(x,y+th/2,z,.9,th,.9,col(0x7a4a3a,.1));const w=4.5+rand()*1.5;
  addS(2,x,y+th+1,z,w,2,w,col(pick([0xff9ec8,0xf06fa6,0xffb0d0]),.05));addS(2,x,y+th+2.5,z,w*.6,1,w*.6,col(0xffc2dd,.05));
  if(rand()<.5)addS(2,x+w/2,y+th,z,1.2,.8,1.2,col(0xf06fa6,.05))}
function oak(x,y,z){const th=2.5+rand()*1.5;P.add(x,y+th/2,z,.9,th,.9,col(0x6b4726,.1));const w=3.6+rand();
  addS(1,x,y+th+1,z,w,2,w,col(pick([0x3f9a3a,0x4aa640,0x368a34]),.05));addS(1,x,y+th+2.3,z,w*.55,1,w*.55,col(0x55b84a,.05))}

  if(rand()<.5){const ay=y+h*.4;P.add(x-.8,ay,z,.7,.7,.7,col(0x3f8f3a,.08));P.add(x-1.1,ay+.7,z,.6,1.3,.6,col(0x3f8f3a,.08))}
  if(rand()<.3)P.add(x,y+h+.3,z,.35,.35,.35,0xff6fa0)}
function scrub(x,y,z,kind){addS(kind,x,y+.4,z,.9+rand()*.5,.8,.9+rand()*.5,col(pick([0x6f8060,0x7d8f6a,0x93a17e]),.06))}

  P.add(x,y+3.5,z,3.4,1.3,3.4,col(pick([0x2f5a2a,0x3a6a30,0x2a4f26]),.06))}

for(let j=0;j<N;j++)for(let i=0;i<N;i++){
  const c=idx(i,j);if(!inside[c])continue;const b=biome[c],x=cx(i)+(rand()-.5)*.6,z=cx(j)+(rand()-.5)*.6,r=rand();
  if(Ls[c]!==-999){

/* seasonal tint tables (multipliers) */
const TINT={1:[[1.08,1.12,.95],[.95,1,.85],[2.2,1,.45],[1.6,1.15,.8]],2:[[1,1,1],[.95,1.05,.95],[1,.8,.55],[.8,.85,.95]],3:[[1,1.1,.95],[.95,.98,.9],[1.5,1,.7],[1.1,1.1,1.1]]};
const SEASON=90,DAY=45,SNAMES=['Spring','Summer','Autumn','Winter'];
let simT=DAY*.3,speed=1,paused=false,lastKey='';
const tmpC=new THREE.Color();
function seasonState(){const sp=((simT/(SEASON*4))%1)*4,s=Math.floor(sp),f=sp-s;return{s,f,bl:ss(.75,1,f),n:(s+1)%4}}
function updateSeasonColors(force){const st=seasonState();const key=st.s+':'+st.bl.toFixed(2);if(key===lastKey&&!force)return;lastKey=key;
  const apply=(inst,list)=>{for(const it of list){const t=TINT[it.kind],a=t[st.s],b=t[st.n];tmpC.setRGB(it.base.r*lerp(a[0],b[0],st.bl),it.base.g*lerp(a[1],b[1],st.bl),it.base.b*lerp(a[2],b[2],st.bl));inst.mesh.setColorAt(it.i,tmpC)}inst.mesh.instanceColor.needsUpdate=true};
  apply(capI,seasonal);apply(P,propSeasonal)}
updateSeasonColors(true);

const botOf=c=>{const x=cx(c%N),z=cx(Math.floor(c/N)),q=qA[c];return -(12+26*Math.pow(Math.max(0,1-q),1.3)+14*Math.max(0,vnoise(x*.2,z*.2,5)-.5)*(1-q*.6))};

    this.g.position.set(this.x,this.y+(this.o.hop?Math.abs(Math.sin(this.ph*.7))*.4:0),this.z);this.g.rotation.y=this.o.side?this.h+Math.PI/2:this.h}
}
const spawn=(fn,n,mk,sp,sc,o)=>{const pool=[];for(let c=0;c<NN;c++)if(inside[c]&&!occ[c]&&!lava[c]&&fn(c))pool.push(c);
  for(let k=0;k<n&&pool.length;k++){const c=pool[Math.floor(rand()*pool.length)];new Animal(mk(k),fn,cx(c%N)+(rand()-.5)*.6,cx(Math.floor(c/N))+(rand()-.5)*.6,sp,sc,o)}};
const land=b=>c=>biome[c]===b&&Ls[c]===-999&&!sandA[c]&&!obs[c];
spawn(land(B.GR),9,()=>mkDeer(false),1.1,1.5);
spawn(land(B.GV),6,()=>mkDeer(false),1,1.5);
spawn(c=>biome[c]===B.JG&&Ls[c]===-999&&eA[c]>0&&(fbm(cx(c%N)*.09,cx(Math.floor(c/N))*.09,21)>.6||nearR[c]||(Math.floor(c/N)>-8)),5,()=>mkDeer(false),.9,1.5);
spawn(land(B.SF),6,()=>mkDeer(true),.9,1.5);
spawn(land(B.HL),7,mkGoat,1,1.5);
spawn(c=>biome[c]===B.DS&&Ls[c]===-999&&H[c]<7,9,mkFox,1.5,1.6);
spawn(c=>biome[c]===B.SW,4,mkCroc,.6,1.6);
spawn(c=>biome[c]===B.SW&&Ls[c]===-999,7,mkFrog,.8,1.6,{hop:1});
spawn(c=>sandA[c]===1&&Ls[c]===-999,12,mkCrab,1.2,1.5,{side:1});
// gulls
const gulls=[];for(let k=0;k<12;k++){const g=mkGull();g.scale.setScalar(1.6);scene.add(g);
  const a=rand()*6.28,c=k%2?[-34,40]:[-46,10];gulls.push({g,cx:c[0]+(rand()-.5)*20,cz:c[1]+(rand()-.5)*20,r:6+rand()*12,a,w:(.2+rand()*.25)*(rand()<.5?1:-1),h:8+rand()*10,ph:rand()*6})}
// fish
const fish=[];const fRivers=rivers.filter(r=>r.kind===2&&r.pts.length>25);
for(let k=0;k<24&&fRivers.length;k++){const r=pick(fRivers);const g=mkFish(pick([0xff8a2a,0xffd23a,0xff5a4a]));g.scale.setScalar(1.3);scene.add(g);fish.push({g,r,f:rand()*(r.pts.length-1),d:rand()<.5?1:-1,sp:2+rand()*3})}
function faunaUpdate(dt,now){
  for(const a of animals)a.update(dt);
  for(const b of gulls){b.a+=b.w*dt;const x=b.cx+Math.cos(b.a)*b.r,z=b.cz+Math.sin(b.a)*b.r;b.g.position.set(x,b.h+Math.sin(now*.001+b.ph)*.8,z);b.g.rotation.y=Math.atan2(-Math.sin(b.a)*b.w,Math.cos(b.a)*b.w);
    const f=Math.sin(now*.008+b.ph*3)*.5;b.g.userData.wings[0].rotation.z=f;b.g.userData.wings[1].rotation.z=-f}
  for(const f of fish){const n=f.r.pts.length;f.f+=f.d*f.sp*dt;if(f.f<0||f.f>n-1){f.d*=-1;f.f=clamp(f.f,0,n-1)}const i=Math.floor(f.f),t=f.f-i,a=f.r.pts[i],b=f.r.pts[Math.min(n-1,i+1)];
    const x=lerp(a[0],b[0],t),z=lerp(a[1],b[1],t),y=lerp(f.r.lev[i],f.r.lev[Math.min(n-1,i+1)],t)+.1;f.g.position.set(x,y,z);f.g.rotation.y=Math.atan2((b[0]-a[0])*f.d,(b[1]-a[1])*f.d)}
}

/* ───────────── sky / day-night / season lighting ───────────── */
const cA=new THREE.Color(),cB=new THREE.Color();
const SSUN=[0xfff4e0,0xfff0c0,0xffc98a,0xd6e4ff],SSUNI=[1,1.08,.92,.8];
let se=1;
function updateSky(){
  const d=(simT%DAY)/DAY,a=(d-.25)*Math.PI*2;se=Math.sin(a);
  const sp=new THREE.Vector3(Math.cos(a)*150,se*150,55);sun.position.copy(sp);sun.target.position.set(0,0,0);sunMesh.position.copy(sp).multiplyScalar(1.1);sunMesh.lookAt(0,0,0);sunMesh.visible=se>-.1;
  const day=ss(-.08,.3,se),warm=(1-ss(.05,.55,se))*(se>-.1?1:0);const st=seasonState();
  const storm=clamp(Math.max(W.bliz||0,W.sand||0,(W.jRain||0)*.4,(W.snow||0)*.6),0,1);
  cA.set(SSUN[st.s]).lerp(cB.set(SSUN[st.n]),st.bl).lerp(cB.set(0xff8a4a),warm*.6).lerp(cB.set(0xa8bcd8),storm*.25);sun.color.copy(cA);
  sun.intensity=1.05*day*lerp(SSUNI[st.s],SSUNI[st.n],st.bl)*(1-storm*.25);
  hemi.color.set(0xbfd8ff).lerp(cB.set(0x1c2c66),1-day);hemi.groundColor.set(0x6a5a4a).lerp(cB.set(0x0a0a16),1-day);hemi.intensity=lerp(.16,.6,day)*(1-storm*.15);
  moon.intensity=(1-day)*.2;sunMesh.material.color.set(0xfff0a0).lerp(cB.set(0xff8a3a),warm*.8);
  const hrs=d*24,hh=Math.floor((hrs+0)%24),mm=Math.floor((hrs%1)*60);
  return{hh,mm,day:Math.floor(simT/DAY)+1}
}

/* ───────────── UI ───────────── */
const LEG=[
 {n:'Whole island',c:'#9aa4b2',w:'high orbit overview',t:[0,4,2],p:[0,100,118]},
 {n:'Snow mountains',c:'#e8f1ff',w:'blizzard on the rear face',t:[0,26,-46],p:[0,54,-112]},
 {n:'Snowy conifer forest',c:'#2a5a3a',w:'snowfall from cloud deck',t:[24,14,-24],p:[24,50,6],lab:[24,-23]},
 {n:'Highlands',c:'#8a9a78',w:'mist · light rain',t:[-26,11,-21],p:[-34,44,10],lab:[-26,-20]},
 {n:'Dense jungle',c:'#1f9d55',w:'persistent rain · mist',t:[12,8,-2],p:[12,46,32],lab:[10,-2]},
 {n:'Swamp / backwater',c:'#6b7a3a',w:'low mist · stagnant pools',t:[42,3,-2],p:[62,28,22],lab:[42,-2]},
 {n:'Grasslands',c:'#6fb04a',w:'river plain · showers',t:[2,4,22],p:[2,42,60],lab:[2,22]},
 {n:'Flowering grove',c:'#f08cbc',w:'blossoms · showers',t:[-28,4,-1],p:[-56,32,24],lab:[-27,0]},
 {n:'Desert',c:'#e0b84c',w:'sandstorm · dry washes',t:[34,5,28],p:[36,52,76],lab:[32,28]},
 {n:'Volcano',c:'#ff5a10',w:'ash · eruptions · obsidian',t:[-22,14,26],p:[-62,46,62],lab:[-22,26]},
 {n:'Coast & ocean',c:'#2fd0c8',w:'beaches · delta · waterfalls',t:[-28,0,38],p:[-62,30,92],lab:[-8,47]}
];
const itemsEl=document.getElementById('items');
LEG.forEach((L,i)=>{const d=document.createElement('div');d.className='item'+(i===0?' on':'');d.innerHTML=`<span class="sw" style="background:${L.c}"></span><span><b>${L.n}</b><i>${L.w}</i></span>`;
  d.onclick=()=>{[...itemsEl.children].forEach(e=>e.classList.remove('on'));d.classList.add('on');flyTo(L.t,L.p)};itemsEl.appendChild(d)});
let fly=null;
function flyTo(t,p){fly={t0:performance.now(),d:1900,p0:camera.position.clone(),tg0:controls.target.clone(),p1:new THREE.Vector3(...p),tg1:new THREE.Vector3(...t)}}
controls.addEventListener('start',()=>{fly=null});
const labels=LEG.filter(l=>l.lab).map(l=>{const e=document.createElement('div');e.className='lab';e.textContent=l.n;document.body.appendChild(e);
  const y=groundY(l.lab[0],l.lab[1])+ (l.n==='Snowy conifer forest'?8:l.n==='Volcano'?10:6);return{e,v:new THREE.Vector3(l.lab[0],y,l.lab[1])}});
const labsCb=document.getElementById('labs');
const pv=new THREE.Vector3();
function updateLabels(){const on=labsCb.checked;for(const L of labels){if(!on){L.e.style.display='none';continue}pv.copy(L.v).project(camera);
  const dist=camera.position.distanceTo(L.v);const vis=pv.z<1&&pv.z>-1&&dist>28;L.e.style.display=vis?'block':'none';
  if(vis){L.e.style.left=((pv.x*.5+.5)*innerWidth)+'px';L.e.style.top=((-pv.y*.5+.5)*innerHeight)+'px';L.e.style.opacity=clamp((dist-28)/40,0,.9)}}}
const bp=document.getElementById('bp'),b1=document.getElementById('b1'),b4=document.getElementById('b4');
const setSpd=(s,el)=>{speed=s;paused=false;[bp,b1,b4].forEach(b=>b.classList.remove('on'));el.classList.add('on')};
bp.onclick=()=>{paused=!paused;bp.classList.toggle('on',paused)};b1.onclick=()=>setSpd(1,b1);b4.onclick=()=>setSpd(4,b4);
const sname=document.getElementById('sname'),stime=document.getElementById('stime'),sbar=document.getElementById('sbar'),wxEl=document.getElementById('wx');
let lastUI=0;
function updateUI(clock){const st=seasonState();sname.textContent=SNAMES[st.s];stime.textContent=`Day ${clock.day} · ${String(clock.hh).padStart(2,'0')}:${String(clock.mm).padStart(2,'0')}`;sbar.style.width=(st.f*100)+'%';
  const ev=[];if(W.snow>.35)ev.push('❄ snowfall over foothills');if(W.bliz>.45)ev.push('🌬 blizzard on rear peaks');if(W.jRain>.6)ev.push('☔ jungle downpour');if(W.gRain>.4||W.vRain>.4)ev.push('☂ showers on plains / grove');
  if(W.hRain>.35)ev.push('mist & rain on highlands');if(W.sand>.4)ev.push('sandstorm across desert');if(W.er>.3)ev.push('🌋 volcanic eruption');
  wxEl.innerHTML=ev.length?ev.join('<br>'):'calm skies'}

/* ───────────── main loop ───────────── */
let last=performance.now(),fr=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused)simT+=dt*speed;
  if(fly){const k=Math.min(1,(now-fly.t0)/fly.d),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;camera.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.tg0,fly.tg1,e);if(k>=1)fly=null}
  const clock=updateSky();
  updateWeather(se);
  if((fr&3)===0)updateSeasonColors(false);
  // lava pulse
  if((fr&1)===0){for(const it of lavaItems){const s=.75+.25*Math.sin(simT*2.2+it.ph*3)+W.er*.3;tmpC.setRGB(1*s,(.25+.3*it.v+.12*Math.sin(simT*1.7+it.ph))*s,.03);lavaI.mesh.setColorAt(it.i,tmpC)}if(lavaI.mesh.instanceColor)lavaI.mesh.instanceColor.needsUpdate=true}
  seamMat.color.set(0x3ab7ff).multiplyScalar(.8+.4*Math.sin(now*.002));
  fallUpdate();foamUpdate();faunaUpdate(paused?0:dt,now);
  if(now-lastUI>250){updateUI(clock);lastUI=now}
  controls.update();updateLabels();
  renderer.render(scene,camera);fr++;
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
window.__world={scene,camera,controls,H,inside};
</script>
