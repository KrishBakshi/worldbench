<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating Biome Island — Voxel World</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  canvas{display:block;}
  #hud{position:fixed;top:12px;left:12px;width:262px;max-height:calc(100vh - 24px);overflow-y:auto;
    background:rgba(10,13,21,0.85);border:1px solid rgba(150,190,255,0.22);border-radius:11px;
    padding:13px 14px;color:#dfe8f4;backdrop-filter:blur(7px);z-index:10;box-sizing:border-box;}
  #hud h1{font-size:14px;margin:0 0 5px;letter-spacing:.5px;color:#eaf2ff;font-weight:600;}
  #hud .sub{font-size:10.5px;color:#93a6bd;line-height:1.55;margin-bottom:10px;}
  .stat{font-size:11px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);
    border-radius:8px;padding:8px 9px;margin-bottom:10px;line-height:1.75;}
  .stat b{color:#fff;font-weight:600;}
  .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:1.15px;color:#7f93ab;margin:0 0 6px;}
  .biome{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;cursor:pointer;
    font-size:11.5px;transition:background .15s;user-select:none;}
  .biome:hover{background:rgba(120,180,255,0.17);}
  .biome.active{background:rgba(120,180,255,0.28);}
  .sw{width:13px;height:13px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(255,255,255,0.28);}
  .nm{flex:1;line-height:1.3;}
  .note{font-size:8.5px;color:#8ba0b8;display:block;}
  #hint{font-size:10px;color:#8ba0b8;border-top:1px solid rgba(255,255,255,0.12);margin-top:10px;
    padding-top:9px;line-height:1.8;}
  #hint b{color:#cfe0f5;}
  #weather{color:#a9d4ff;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(140,180,255,0.32);border-radius:3px;}
</style>

<body>
<div id="hud">
  <h1>◆ Floating Biome Island</h1>
  <div class="sub">A voxel continent adrift in the black void. Orbit the world and visit every living biome.</div>
  <div class="stat">
    <div>Season: <b id="season">Spring</b></div>
    <div>Time: <b id="time">Morning</b></div>
    <div id="weather">Weather: <b>clear</b></div>
  </div>
  <div class="lbl">Biomes — click to fly</div>
  <div id="legend"></div>
  <div id="hint">
    Drag / touch &nbsp;<b>orbit</b><br>
    Scroll / pinch &nbsp;<b>zoom</b><br>
    Right-drag / two fingers &nbsp;<b>pan</b>
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= RENDERER / SCENE / CAMERA ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x04060c, 720, 1950);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 1, 4200);
camera.position.set(300, 250, 360);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 26, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.minDistance = 55;
controls.maxDistance = 1250;
controls.maxPolarAngle = Math.PI * 0.93;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= LIGHTS + SQUARE SUN ================= */
const ambient = new THREE.AmbientLight(0x6c86bb, 0.55);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x9dc4ff, 0x1b2333, 0.42);
scene.add(hemi);

const sunLight = new THREE.DirectionalLight(0xfff2dd, 1.6);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
const shc = sunLight.shadow.camera;
shc.left = -250; shc.right = 250; shc.top = 250; shc.bottom = -250; shc.near = 10; shc.far = 1500;
sunLight.shadow.bias = -0.0011;
sunLight.shadow.normalBias = 1.2;
scene.add(sunLight, sunLight.target);

const sunMesh = new THREE.Mesh(new THREE.BoxGeometry(32, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xffdd77, fog: false }));
scene.add(sunMesh);

const emberLight = new THREE.PointLight(0xff5a12, 2.2, 190, 2);
emberLight.position.set(78, 88, -32);
scene.add(emberLight);

/* ================= HELPERS ================= */
function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function vnoise(x, y) {
  const x0 = Math.floor(x), y0 = Math.floor(y);
  const fx = x - x0, fy = y - y0;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(x0, y0), b = hash2(x0 + 1, y0), c = hash2(x0, y0 + 1), d = hash2(x0 + 1, y0 + 1);
  return a * (1 - ux) * (1 - uy) + b * ux * (1 - uy) + c * (1 - ux) * uy + d * ux * uy;
}
function fbm(x, y, oct) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < (oct || 3); i++) { s += amp * vnoise(x * f, y * f); norm += amp; f *= 2.03; amp *= 0.5; }
  return s / norm;
}
function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

const _box = new THREE.BoxGeometry(1, 1, 1);
const _bp = _box.attributes.position, _bn = _box.attributes.normal, _bi = _box.index;

function voxGeo(blocks) {
  const pos = [], nor = [], colr = [];
  const c = new THREE.Color();
  for (const bl of blocks) {
    c.setRGB(bl.c[0], bl.c[1], bl.c[2], THREE.SRGBColorSpace);
    const w = bl.w === undefined ? 2 : bl.w;
    const h = bl.h === undefined ? 2 : bl.h;
    const d = bl.d === undefined ? 2 : bl.d;
    const px = bl.x || 0, py = bl.y || 0, pz = bl.z || 0;
    const ry = bl.ry || 0, cs = Math.cos(ry), sn = Math.sin(ry);
    for (let k = 0; k < _bi.count; k++) {
      const vi = _bi.getX(k);
      const bx = _bp.getX(vi) * w, by = _bp.getY(vi) * h, bz = _bp.getZ(vi) * d;
      pos.push(bx * cs + bz * sn + px, by + py, -bx * sn + bz * cs + pz);
      const nx = _bn.getX(vi), ny = _bn.getY(vi), nz = _bn.getZ(vi);
      nor.push(nx * cs + nz * sn, ny, -nx * sn + nz * cs);
      colr.push(c.r, c.g, c.b);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colr, 3));
  return g;
}
function unitCubeGeo() {
  const g = new THREE.BoxGeometry(1, 1, 1);
  const n = g.attributes.position.count;
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 3).fill(1), 3));
  return g;
}

const _dummy = new THREE.Object3D();
const _tmpCol = new THREE.Color();

function buildInstanced(data, material, cast, receive) {
  const mesh = new THREE.InstancedMesh(unitCubeGeo(), material, data.length);
  for (let k = 0; k < data.length; k++) {
    const d = data[k];
    _dummy.position.set(d.x, d.y, d.z);
    _dummy.rotation.set(0, d.ry || 0, 0);
    _dummy.scale.set(d.sx, d.sy, d.sz);
    _dummy.updateMatrix();
    mesh.setMatrixAt(k, _dummy.matrix);
    mesh.setColorAt(k, _tmpCol.setRGB(d.r, d.g, d.b, THREE.SRGBColorSpace));
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = !!cast;
  mesh.receiveShadow = receive !== false;
  return mesh;
}
function buildVoxelInstances(blocks, entries, material, cast, receive) {
  const mesh = new THREE.InstancedMesh(voxGeo(blocks), material, entries.length);
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    _dummy.position.set(e.x, e.y, e.z);
    _dummy.rotation.set(0, e.ry || 0, 0);
    _dummy.scale.setScalar(e.s === undefined ? 1 : e.s);
    _dummy.updateMatrix();
    mesh.setMatrixAt(i, _dummy.matrix);
    const t = e.tint === undefined ? 1 : e.tint;
    mesh.setColorAt(i, _tmpCol.setRGB(t, t, t));
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = !!cast;
  mesh.receiveShadow = receive !== false;
  return mesh;
}

/* ================= WORLD GENERATION ================= */
const N = 144, B = 2, HALF = N / 2, SEA = 10;
const H = new Float32Array(N * N);
const BIO = new Uint8Array(N * N);
const WAT = new Float32Array(N * N);
const WATK = new Uint8Array(N * N);
const LAV = new Float32Array(N * N);
const LAND = new Uint8Array(N * N);
const SCOL = new Float32Array(N * N * 3);
const DN = new Float32Array(N * N);

const OCEAN = 1, BEACH = 2, MOUNT = 3, SNOWF = 4, HIGH = 5, JUNG = 6,
      SWAMP = 7, PLAINS = 8, GROVE = 9, DESERT = 10, VOLC = 11;

const REGIONS = [
  { cx: -4,  cz: -72, rx: 62, rz: 38, h: 52 },
  { cx: -6,  cz: -32, rx: 52, rz: 22, h: 31 },
  { cx: -62, cz: -4,  rx: 38, rz: 34, h: 40 },
  { cx: 46,  cz: -14, rx: 46, rz: 36, h: 24 },
  { cx: 84,  cz: 28,  rx: 30, rz: 28, h: 11 },
  { cx: 0,   cz: 48,  rx: 52, rz: 26, h: 15 },
  { cx: -56, cz: 42,  rx: 30, rz: 24, h: 13 },
  { cx: 44,  cz: 72,  rx: 50, rz: 30, h: 13 },
  { cx: 78,  cz: -32, rx: 30, rz: 28, h: 22 }
];
const PEAKS = [
  { x: -30, z: -84, r: 26, a: 44 }, { x: 16, z: -88, r: 22, a: 50 },
  { x: -4,  z: -64, r: 20, a: 32 }, { x: 48, z: -76, r: 22, a: 36 },
  { x: -58, z: -70, r: 20, a: 30 }
];
const DESERT_PEAKS = [
  { x: 22, z: 78, r: 22, a: 28 }, { x: 76, z: 62, r: 20, a: 24 }, { x: 52, z: 88, r: 18, a: 20 }
];
function islandDist(x, z) {
  const n = (fbm(x * 0.0062 + 11.3, z * 0.0062 - 7.7, 3) - 0.5) * 0.30;
  return Math.sqrt((x / 118) * (x / 118) + (z / 114) * (z / 114)) + n;
}

const WS = new Float64Array(REGIONS.length);

for (let j = 0; j < N; j++) {
  for (let i = 0; i < N; i++) {
    const id = j * N + i;
    const x = (i - HALF) * B, z = (j - HALF) * B;
    const d = islandDist(x, z);
    DN[id] = d;
    if (d > 1.02) { LAND[id] = 0; continue; }
    LAND[id] = 1;

    let wsum = 0, hsum = 0, best = 0, bestw = -1;
    for (let k = 0; k < REGIONS.length; k++) {
      const r = REGIONS[k];
      const nz = (fbm(x * 0.010 + k * 17.3, z * 0.010 - k * 9.1, 2) - 0.5) * 0.42;
      const dd = Math.hypot((x - r.cx) / r.rx, (z - r.cz) / r.rz) + nz;
      const w = Math.exp(-2.2 * dd * dd);
      WS[k] = w; wsum += w; hsum += w * r.h;
      if (w > bestw) { bestw = w; best = k; }
    }
    let base = hsum / wsum;
    const amp = 2.0 + (best === 0 ? 7.5 : 0) + (best === 3 ? 3.2 : 0) +
                (best === 2 ? 3.6 : 0) + (best === 7 ? 2.2 : 0);
    base += (fbm(x * 0.016 + 5.5, z * 0.016 - 2.5, 4) - 0.5) * amp * 2.2;

    const mw = WS[0] / wsum;
    for (const p of PEAKS) {
      const dd = Math.hypot(x - p.x, z - p.z) / p.r;
      if (dd < 1) base += p.a * Math.pow(1 - dd, 1.7) * mw;
    }
    const dw = WS[7] / wsum;
    for (const p of DESERT_PEAKS) {
      const dd = Math.hypot(x - p.x, z - p.z) / p.r;
      if (dd < 1) base += p.a * Math.pow(1 - dd, 1.6) * dw;
    }

    const dv = Math.hypot(x - 78, z + 32) / 30;
    if (dv < 1.12) {
      const t = Math.max(0, 1 - dv);
      let cone = Math.pow(t, 1.35) * 82;
      if (dv < 0.20) cone -= (0.20 - dv) / 0.20 * 26;
      const vw = Math.min(1, t * 2.4);
      base = base * (1 - vw) + (20 + cone) * vw;
    }

    const coastal = smoothstep(0.80, 1.0, d);
    let h = base * (1 - coastal) + 3 * coastal;
    h = Math.max(2, Math.round(h / B) * B);
    if (dv < 0.17) { h = 70; LAV[id] = 74; }
    H[id] = h;

    let biome;
    if (h < SEA) biome = OCEAN;
    else if (h <= 13 && d > 0.80) biome = BEACH;
    else biome = best + 3;
    BIO[id] = biome;

    if (h < SEA) { WAT[id] = SEA; WATK[id] = 1; }

    const n1 = fbm(x * 0.06 + 3.3, z * 0.06 - 1.7, 2);
    const n2 = fbm(x * 0.018 - 8.1, z * 0.018 + 4.2, 3);
    let r = 0.5, g = 0.5, b = 0.5;

    if (biome === OCEAN) {
      const t = smoothstep(0.86, 1.0, d);
      r = 0.62 * (1 - t) + 0.28 * t; g = 0.64 * (1 - t) + 0.40 * t; b = 0.50 * (1 - t) + 0.46 * t;
    } else if (biome === BEACH) {
      const v = 0.86 + n1 * 0.16; r = 0.93 * v; g = 0.86 * v; b = 0.66 * v;
    } else if (biome === MOUNT) {
      if (h > 58) { const v = 0.88 + n1 * 0.13; r = v; g = v; b = Math.min(1, v * 1.07); }
      else { const v = 0.82 + n2 * 0.40; r = 0.43 * v; g = 0.47 * v; b = 0.58 * v; }
    } else if (biome === SNOWF) {
      const sn = fbm(x * 0.075 + 12.1, z * 0.075 - 3.4, 2);
      if (sn > 0.50 || h > 42) { const v = 0.88 + n1 * 0.12; r = v; g = v * 1.01; b = Math.min(1, v * 1.06); }
      else { const v = 0.86 + n1 * 0.26; r = 0.21 * v; g = 0.30 * v; b = 0.23 * v; }
    } else if (biome === HIGH) {
      const v = 0.84 + n2 * 0.34;
      if (n2 > 0.58) { r = 0.52 * v; g = 0.52 * v; b = 0.47 * v; }
      else { r = 0.41 * v; g = 0.47 * v; b = 0.33 * v; }
    } else if (biome === JUNG) {
      const v = 0.82 + n1 * 0.36;
      if (n2 > 0.55) { r = 0.09 * v; g = 0.28 * v; b = 0.12 * v; }
      else { r = 0.11 * v; g = 0.36 * v; b = 0.14 * v; }
    } else if (biome === SWAMP) {
      const v = 0.86 + n1 * 0.26; r = 0.28 * v; g = 0.32 * v; b = 0.16 * v;
    } else if (biome === PLAINS) {
      const v = 0.86 + n1 * 0.28;
      if (n2 > 0.56) { r = 0.38 * v; g = 0.53 * v; b = 0.22 * v; }
      else { r = 0.28 * v; g = 0.51 * v; b = 0.19 * v; }
    } else if (biome === GROVE) {
      const v = 0.88 + n1 * 0.24;
      if (n2 > 0.6) { r = 0.62 * v; g = 0.53 * v; b = 0.42 * v; }
      else { r = 0.79 * v; g = 0.57 * v; b = 0.60 * v; }
    } else if (biome === DESERT) {
      const v = 0.88 + n1 * 0.22;
      if (h > 26) { r = 0.79 * v; g = 0.63 * v; b = 0.38 * v; }
      else { r = 0.88 * v; g = 0.73 * v; b = 0.42 * v; }
    } else if (biome === VOLC) {
      const v = 0.82 + n1 * 0.36;
      if (n2 > 0.62) { r = 0.30 * v; g = 0.12 * v; b = 0.10 * v; }
      else { r = 0.17 * v; g = 0.14 * v; b = 0.16 * v; }
    }
    SCOL[id * 3] = r; SCOL[id * 3 + 1] = g; SCOL[id * 3 + 2] = b;
  }
}

/* ================= RIVERS / LAVA / SWAMP ================= */
const falls = [];
function carve(points, w0, w1, kind) {
  let prevE = null, prevX = 0, prevZ = 0;
  for (let s = 0; s < points.length - 1; s++) {
    const a = points[s], b = points[s + 1];
    const dx = b[0] - a[0], dz = b[1] - a[1], de = b[2] - a[2];
    const steps = Math.max(1, Math.ceil(Math.hypot(dx, dz) / 1.4));
    for (let k = 0; k <= steps; k++) {
      const t = k / steps;
      const x = a[0] + dx * t, z = a[1] + dz * t, e = a[2] + de * t;
      const gT = (s + t) / (points.length - 1);
      const w = w0 + (w1 - w0) * gT;
      const ci = Math.round(x / B) + HALF, cj = Math.round(z / B) + HALF;
      const rad = Math.ceil(w / B) + 1;
      for (let jj = cj - rad; jj <= cj + rad; jj++) {
        for (let ii = ci - rad; ii <= ci + rad; ii++) {
          if (ii < 0 || jj < 0 || ii >= N || jj >= N) continue;
          const id = jj * N + ii;
          if (!LAND[id]) continue;
          const cx = (ii - HALF) * B, cz = (jj - HALF) * B;
          if (Math.hypot(cx - x, cz - z) > w) continue;
          const wq = Math.round(Math.min(e, H[id] + 1.2) / B) * B;
          if (kind === 1) {
            if (wq > LAV[id]) LAV[id] = wq;
            H[id] = Math.min(H[id], wq - 2);
          } else {
            if (wq > WAT[id]) { WAT[id] = wq; WATK[id] = kind; }
            H[id] = Math.min(H[id], wq - 2);
          }
        }
      }
      if (prevE !== null && prevE - e > 5) falls.push({ x: prevX, z: prevZ, top: prevE, bot: Math.max(4, e) });
      prevE = e; prevX = x; prevZ = z;
    }
  }
}

/* wet corridor : mountains -> snow forest -> jungle -> grasslands -> coastal delta */
carve([[-2,-96,84],[-6,-84,68],[-4,-72,54],[-8,-60,42],[-4,-48,32],[2,-38,26],[10,-28,22],
       [20,-20,20],[28,-12,19],[26,-2,18],[16,6,17],[4,14,16],[-8,24,15],[-18,34,13],
       [-26,44,12],[-32,56,11],[-36,68,10],[-38,80,10]], 2.6, 8.5, 2);
/* highlands -> flowering grove feeder -> main river */
carve([[-64,-6,36],[-62,4,28],[-58,14,21],[-54,24,16],[-50,32,14],[-44,40,12],[-38,48,11],[-33,55,10.5]], 2.2, 4.2, 2);
/* snow forest tributary east through jungle */
carve([[36,-64,32],[34,-52,26],[32,-42,22],[30,-32,20],[26,-21,19]], 2.0, 3.6, 2);
/* grove west stream to the west coast */
carve([[-56,34,15],[-66,40,12],[-76,46,11],[-86,52,10.4],[-93,57,10]], 1.9, 3.4, 2);
/* grassland tributaries */
carve([[6,26,15],[16,32,14],[12,42,13],[2,46,12.4],[-6,30,14]], 1.6, 2.6, 2);
carve([[-30,12,15],[-24,22,14],[-16,30,13],[-10,34,12.6]], 1.5, 2.4, 2);
/* braided coastal delta */
carve([[-38,80,10],[-48,86,10],[-56,90,10]], 3.2, 4.6, 2);
carve([[-38,80,10],[-32,88,10],[-28,95,10]], 3.0, 4.4, 2);
carve([[-38,80,10],[-42,92,10],[-44,100,10]], 2.8, 4.2, 2);
carve([[-32,56,11],[-42,62,10.6],[-50,68,10.2],[-54,76,10]], 2.2, 3.6, 2);
/* mountain melt meets lava -> obsidian + steam */
carve([[58,-84,40],[64,-74,32],[70,-66,26],[74,-58,22],[68,-58,20],[62,-60,19]], 1.8, 3.2, 2);
/* lava tributaries, volcanic ground only */
carve([[78,-38,66],[74,-44,52],[70,-50,38],[66,-55,28],[62,-59,22]], 2.2, 3.6, 1);
carve([[86,-26,66],[92,-22,52],[98,-18,38],[102,-12,28],[104,-6,22]], 2.0, 3.2, 1);
carve([[74,-22,64],[70,-18,52],[67,-14,40],[65,-11,30],[64,-10,24]], 1.8, 3.0, 1);

/* swamp backwater pools + stagnant channels */
for (let j = 0; j < N; j++) {
  for (let i = 0; i < N; i++) {
    const id = j * N + i;
    if (!LAND[id] || BIO[id] !== SWAMP) continue;
    const x = (i - HALF) * B, z = (j - HALF) * B;
    if (fbm(x * 0.028 + 4.1, z * 0.028 - 6.2, 3) > 0.50) { H[id] = 9; WAT[id] = 11; WATK[id] = 3; }
  }
}

/* sand islets / reefs / rocky headlands */
for (let j = 2; j < N - 2; j++) {
  for (let i = 2; i < N - 2; i++) {
    const id = j * N + i;
    if (!LAND[id]) continue;
    const d = DN[id];
    if (BIO[id] === OCEAN && d > 0.855 && d < 0.965 && hash2(i * 5.7, j * 3.1) > 0.987) {
      H[id] = 10; BIO[id] = BEACH; WAT[id] = SEA; WATK[id] = 1;
      SCOL[id * 3] = 0.93; SCOL[id * 3 + 1] = 0.86; SCOL[id * 3 + 2] = 0.66;
    }
    if (BIO[id] === BEACH && d > 0.88 && hash2(i * 2.9, j * 7.3) > 0.992) {
      H[id] = 18; BIO[id] = MOUNT;
      SCOL[id * 3] = 0.42; SCOL[id * 3 + 1] = 0.44; SCOL[id * 3 + 2] = 0.50;
    }
  }
}

/* ================= TERRAIN MESH ================= */
const solidData = [], glowData = [];
for (let j = 0; j < N; j++) {
  for (let i = 0; i < N; i++) {
    const id = j * N + i;
    if (!LAND[id]) continue;
    const x = (i - HALF) * B, z = (j - HALF) * B, h = H[id];
    let minN = h;
    const nb = [[1,0],[-1,0],[0,1],[0,-1]];
    for (let q = 0; q < 4; q++) {
      const ii = i + nb[q][0], jj = j + nb[q][1];
      if (ii < 0 || jj < 0 || ii >= N || jj >= N) { minN = Math.min(minN, -16); continue; }
      const nid = jj * N + ii;
      if (!LAND[nid]) { minN = Math.min(minN, -16); continue; }
      minN = Math.min(minN, H[nid]);
    }
    minN = Math.max(minN, h - 18);
    const r = SCOL[id * 3], g = SCOL[id * 3 + 1], b = SCOL[id * 3 + 2];
    solidData.push({ x, y: h - 1, z, sx: B, sy: 2, sz: B, r, g, b });
    const sr = r * 0.52 + 0.06, sg = g * 0.52 + 0.06, sb = b * 0.52 + 0.07;
    for (let y = h - 2; y > minN; y -= 2) {
      solidData.push({ x, y: y - 1, z, sx: B, sy: 2, sz: B, r: sr, g: sg, b: sb });
    }
    const fh = minN + 54;
    if (fh > 0) {
      const v = 0.85 + hash2(i * 1.3, j * 2.7) * 0.3;
      solidData.push({ x, y: (minN - 54) / 2, z, sx: B, sy: fh, sz: B, r: 0.22 * v, g: 0.21 * v, b: 0.25 * v });

      for (let k = 0; k < 3; k++) {

    }
  }
}

    if (wl <= 0 || wl <= H[id]) continue;
    const x = (i - HALF) * B, z = (j - HALF) * B;
    const thick = Math.min(9, Math.max(2, wl - H[id] + 2));

    waterData.push({ x, y: wl - thick / 2, z, sx: B, sy: thick, sz: B, r, g, b });

    const top = f.top, bot = Math.max(-20, f.bot - 12);

}

    const h = H[id];
    if (WAT[id] > h || LAV[id] > h) continue;
    const x = (i - HALF) * B, z = (j - HALF) * B;
    const r = hash2(i * 1.73 + 0.11, j * 2.31 - 0.42);
    const r2 = hash2(i * 4.11 - 2.2, j * 3.17 + 1.4);
    const ry = Math.floor(r2 * 4) * Math.PI * 0.5;
    const s = 0.85 + r2 * 0.55;
    const add = (arr) => arr.push({
      x: x + (r2 - 0.5) * B * 1.5, y: h, z: z + (r - 0.5) * B * 1.5,
      ry, s, tint: 0.85 + r * 0.35
    });
    switch (BIO[id]) {
      case SNOWF: if (r < 0.30) add(P.pineSnow); else if (r > 0.985) add(P.rock); break;
      case JUNG:  if (r < 0.42) add(P.jungle); else if (r > 0.975) add(P.rock); break;
      case PLAINS:
        if (r < 0.055) add(P.oak);
        else if (r > 0.12 && r < 0.42) add(r2 > 0.5 ? P.fY : P.fW);
        else if (r > 0.988) add(P.rock);
        break;
      case GROVE: if (r < 0.27) add(P.grove); else if (r > 0.34 && r < 0.66) add(P.fP); break;
      case DESERT:
        if (r < 0.030) add(P.cactus);
        else if (r > 0.055 && r < 0.115) add(P.bush);
        else if (r > 0.988) add(P.rock);
        break;
      case HIGH:  if (r < 0.055) add(P.scrub); else if (r > 0.07 && r < 0.11) add(P.rock); break;
      case SWAMP: if (r < 0.13) add(P.mangrove); else if (r > 0.94) add(P.bush); break;
      case BEACH: if (r < 0.016) add(P.palm); else if (r > 0.985) add(P.rock); break;
      case MOUNT: if (h < 42 && r < 0.022) add(P.scrub); else if (r > 0.982) add(P.rock); break;
      case VOLC:  if (r > 0.986) add(P.rock); break;
    }
  }
}

function cellsOfBiome(list, want) {
  const out = [];
  for (let j = 4; j < N - 4; j += 2) {
    for (let i = 4; i < N - 4; i += 2) {
      const id = j * N + i;
      if (!LAND[id]) continue;
      if (list.indexOf(BIO[id]) < 0) continue;
      if (WAT[id] > H[id] || LAV[id] > H[id]) continue;
      out.push({ i, j, h: H[id] });
    }
  }
  const sh = [];
  while (out.length && sh.length < want) sh.push(out.splice(Math.floor(Math.random() * out.length), 1)[0]);
  return sh;
}
function waterCellsOf(list, want) {
  const out = [];
  for (let j = 4; j < N - 4; j += 2) {
    for (let i = 4; i < N - 4; i += 2) {
      const id = j * N + i;
      if (!LAND[id]) continue;
      if (list.indexOf(BIO[id]) < 0) continue;
      if (WAT[id] <= H[id]) continue;
      out.push({ i, j, h: WAT[id] - 3.2 });
    }
  }
  const sh = [];
  while (out.length && sh.length < want) sh.push(out.splice(Math.floor(Math.random() * out.length), 1)[0]);
  return sh;
}

/* ================= WEATHER PARTICLES ================= */
function particles(count, color, size, opacity, init, upd) {
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) init(pos, i);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    color, size, transparent: true, opacity, depthWrite: false, sizeAttenuation: true
  });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false;
  scene.add(p);
  return { points: p, material: m, pos, count, upd, base: opacity, phase: Math.random() * 6.28 };
}
function boxInit(cx, cz, rx, rz, y0, y1) {
  return (arr, i) => {
    arr[i * 3] = cx + (Math.random() - 0.5) * rx;
    arr[i * 3 + 1] = y0 + Math.random() * (y1 - y0);
    arr[i * 3 + 2] = cz + (Math.random() - 0.5) * rz;
  };
}

/* ================= SEASONS / DAY-NIGHT ================= */
const SEASONS = ['Spring', 'Summer', 'Autumn', 'Winter'];
const seasonEl = document.getElementById('season');
const timeEl = document.getElementById('time');
const weatherEl = document.getElementById('weather');

let seasonPhase = 0.02, dayPhase = 0.30;
const seasonTints = [
  new THREE.Color(0xffe9d0), new THREE.Color(0xfff4e2),
  new THREE.Color(0xffd0a0), new THREE.Color(0xcfe6ff)
];
const nightTint = new THREE.Color(0xffd9b0);

function updateCycle(dt) {
  seasonPhase = (seasonPhase + dt / 240) % 1;
  dayPhase = (dayPhase + dt / 110) % 1;

  const sIdx = Math.floor(seasonPhase * 4) % 4;
  seasonEl.textContent = SEASONS[sIdx];

  const ang = dayPhase * Math.PI * 2 - Math.PI * 0.5;
  const sx = Math.cos(ang) * 560, sy = Math.sin(ang) * 440, sz = 300;
  sunMesh.position.set(sx, sy, sz);
  sunLight.position.set(sx, sy, sz);

  const dayness = THREE.MathUtils.clamp(Math.sin(ang) * 1.5 + 0.25, 0, 1);
  sunLight.intensity = 0.12 + dayness * 1.75;
  ambient.intensity = 0.16 + dayness * 0.55;
  hemi.intensity = 0.12 + dayness * 0.42;
  sunMesh.material.color.setHSL(0.11 - 0.03 * (1 - dayness), 0.75, 0.35 + dayness * 0.28);
  sunLight.color.copy(seasonTints[sIdx]).lerp(nightTint, 1 - dayness);

  const hours = (dayPhase * 24 + 6) % 24;
  timeEl.textContent =
    hours < 5 ? 'Night' : hours < 8 ? 'Dawn' : hours < 11 ? 'Morning' :
    hours < 15 ? 'Midday' : hours < 18 ? 'Afternoon' : hours < 21 ? 'Dusk' : 'Night';

  emberLight.intensity = 1.6 + Math.sin(performance.now() * 0.003) * 0.6;
  return { sIdx, dayness };
}

/* ================= CAMERA FLY ================= */
const fly = {
  active: false, t: 0, dur: 1.5,
  fp: new THREE.Vector3(), tp: new THREE.Vector3(),
  ft: new THREE.Vector3(), tt: new THREE.Vector3()
};
function flyTo(px, py, pz, tx, ty, tz) {
  fly.fp.copy(camera.position); fly.tp.set(px, py, pz);
  fly.ft.copy(controls.target); fly.tt.set(tx, ty, tz);
  fly.t = 0; fly.active = true;
}
function updateFly(dt) {
  if (!fly.active) return;
  fly.t = Math.min(1, fly.t + dt / fly.dur);
  const e = fly.t < 0.5 ? 4 * fly.t * fly.t * fly.t : 1 - Math.pow(-2 * fly.t + 2, 3) / 2;
  camera.position.lerpVectors(fly.fp, fly.tp, e);
  controls.target.lerpVectors(fly.ft, fly.tt, e);
  if (fly.t >= 1) fly.active = false;
}

/* ================= ANIMATION LOOP ================= */
let last = performance.now(), hudTimer = 0;
let lastWeather = '';

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  const cyc = updateCycle(dt);
  updateFly(dt);

  for (const c of clouds) {
    c.mesh.position.x += c.spd * dt;
    c.mesh.position.y = c.base + Math.sin(now * 0.0006 + c.ph) * 3;
    if (c.mesh.position.x > 190) c.mesh.position.x = -190;
  }

  /* weather arrives in staggered cyclic bursts */
  for (let i = 0; i < systems.length; i++) {
    const s = systems[i];
    const ph = (now * 0.000055 + s.phase) % (Math.PI * 2);
    const burst = Math.max(0, Math.sin(ph) * 1.25);
    let op = s.base * Math.min(1, burst);
    if (i === 1) op *= (cyc.sIdx === 3 ? 1.2 : 0.6);   /* snow stronger in winter */
    if (i === 0) op *= (cyc.sIdx === 1 ? 1.2 : 0.85);  /* rain stronger in summer */
    s.material.opacity = op;
    s.upd(s.pos, dt, s);
    s.points.geometry.attributes.position.needsUpdate = true;
    s.points.visible = op > 0.02;
  }

  /* fauna wander */
  for (const a of animals) {
    a.ang += a.spd * dt;
    const x = a.cx + Math.cos(a.ang) * a.rad;
    const z = a.cz + Math.sin(a.ang) * a.rad;
    a.bob += dt * 3.2;
    a.mesh.position.set(x, a.y + Math.abs(Math.sin(a.bob)) * 0.55, z);
    a.mesh.rotation.y = -a.ang + (a.spd > 0 ? 0 : Math.PI);
    a.mesh.rotation.z = Math.sin(a.bob * 0.5) * 0.05;
  }

  hudTimer += dt;
  if (hudTimer > 0.4) {
    hudTimer = 0;
    const t = now * 0.001;
    const season = SEASONS[Math.floor(seasonPhase * 4) % 4];
    let w = 'clear skies';
    if (Math.sin(t * 0.11) > 0.45) w = 'jungle rain';
    if (Math.sin(t * 0.09 + 1.2) > 0.5) w = 'alpine blizzard';
    if (Math.sin(t * 0.07 + 2.4) > 0.55) w = 'desert sandstorm';
    if (Math.sin(t * 0.13 + 0.7) > 0.6) w = 'volcanic ash';
    if (Math.sin(t * 0.10 + 3.1) > 0.5) w = season === 'Winter' ? 'snowfall' : 'highland mist';
    if (w !== lastWeather) {
      lastWeather = w;
      weatherEl.innerHTML = 'Weather: <b>' + w + '</b>';
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
