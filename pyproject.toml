[project]
name = "worldbench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.3",
    "langchain-openai>=1.4.3",
    "langchain-openrouter>=0.2.7",
    "langsmith>=0.10.17",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "playwright>=1.62.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "tqdm>=4.70.0",
]
